  }
  function stepAnchor(p, anchor, dir) {
    if (p === "day") return addDays(anchor, dir);
    if (p === "week") return addDays(anchor, 7 * dir);
    const m = addMonths(monthOf(anchor), p === "year" ? 12 * dir : dir);
    return dayInMonth(m, Number(anchor.slice(8)));
  }
  const inPeriod = (p, anchor, d = todayISO()) => { const r = periodRange(p, anchor); return d >= r.from && d <= r.to; };
  const entriesBetween = (from, to) => state.entries.filter((e) => e.date >= from && e.date <= to);
  const PERIOD_WORD = { day: "day", week: "week", month: "month", year: "year" };

  /* ---------- budgets ---------- */
  /* With carry-forward on, what was left of last month's budget is added to this month. It only ever looks back one
     month, so unused money doesn't pile up forever. */
  function withCarry(base, m, prevSpent) {
    if (!(base > 0)) return { base: 0, carry: 0, total: 0 };
    const prev = addMonths(m, -1);
    const carry = state.settings.carry && entriesIn(prev).length ? Math.max(0, round2(base - prevSpent(prev))) : 0;
    return { base, carry, total: round2(base + carry) };
  }
  const budgetFor = (m) => withCarry(state.settings.budget || 0, m, (prev) => totals(entriesIn(prev)).spent);
  const catBudgetFor = (c, m) => withCarry(c.budget || 0, m, (prev) => catTotals(entriesIn(prev)).find((x) => x.id === c.id)?.total || 0);
  const LEVELS = [100, 80, 50];
  const levelOf = (spent, total) => (total > 0 ? LEVELS.find((l) => (spent / total) * 100 >= l) || 0 : 0);
  /* Every budget for a month: the whole month first, then categories. */
  function budgetStatus(m) {
    const list = entriesIn(m);
    const spent = Math.max(0, totals(list).spent);
    const byCat = new Map(catTotals(list).map((c) => [c.id, c.total]));
    const out = [];
    const b = budgetFor(m);
    if (b.total > 0) out.push({ id: "", name: "Monthly budget", color: "", spent, ...b, pct: (spent / b.total) * 100, level: levelOf(spent, b.total) });
    for (const c of state.categories) {
      if (c.kind !== "expense" || !(c.budget > 0)) continue;
      const cb = catBudgetFor(c, m), sp = byCat.get(c.id) || 0;
      out.push({ id: c.id, name: c.name, color: c.color, spent: sp, ...cb, pct: (sp / cb.total) * 100, level: levelOf(sp, cb.total) });
    }
    return out;
  }
  /* Budgets that moved up a level (50, 80 or 100%) between two snapshots, for the alert after saving an entry. */
  function crossedLevels(before, after) {
    const was = new Map(before.map((b) => [b.id, b.level]));
    return after.filter((b) => b.level > (was.get(b.id) || 0));
  }
  const levelText = (b) => (b.level >= 100 ? `${b.name} is over budget` : `${b.name} is ${Math.floor(b.pct)}% used`);

  /* ---------- no-spend days ---------- */
  /* A no-spend day has no spending apart from recurring bills. Days before your first entry don't count. */
  function firstEntryDate() { let f = ""; for (const e of state.entries) if (!f || e.date < f) f = e.date; return f; }
  function discretionaryDays() {
    const set = new Set();
    for (const e of state.entries) if (e.type === "expense" && !e.recurringId) set.add(e.date);
    return set;
  }
  function noSpendStats(from, to) {
    const t = todayISO(), first = firstEntryDate(), spent = discretionaryDays();
    let count = 0, run = 0, longest = 0, counted = 0;
    if (first) {
      for (let d = from < first ? first : from; d <= to && d <= t; d = addDays(d, 1)) {
        counted++;
        if (spent.has(d)) { run = 0; continue; }
        count++; run++; longest = Math.max(longest, run);
      }
    }
    return { count, longest, counted };
  }
  /* No-spend days in a row up to and including today. */
  function noSpendStreak() {
    const first = firstEntryDate(), spent = discretionaryDays();
    if (!first) return 0;
    let n = 0;
    for (let d = todayISO(), guard = 0; d >= first && guard < 800; d = addDays(d, -1), guard++) { if (spent.has(d)) break; n++; }
    return n;
  }

  /* ---------- debts ---------- */
  function debtStatus(p) {
    if (!p.due || !p.balance) return null;
    const days = daysBetween(todayISO(), p.due);
    return { days, overdue: days < 0, soon: days >= 0 && days <= SOON_DAYS };
  }
  function debtText(st) {
    if (!st) return "";
    if (st.overdue) return `Overdue ${plural(-st.days, "day")}`;
    if (st.days === 0) return "Due today";
    if (st.days === 1) return "Due tomorrow";
    return st.soon ? `Due in ${st.days} days` : "";
  }

  /* ---------- subscriptions, payment methods, balances ---------- */
  const isSubscription = (r) => r.kind === "expense" && r.category === "subscriptions";
  function subscriptions() {
    const t = todayISO();
    const list = state.recurring.filter((r) => isSubscription(r) && r.active !== false).map((r) => ({ r, st: cycleStatus(r, t), monthly: round2(r.amount * FREQ[r.frequency].perMonth) })).filter((x) => x.st);
    const monthly = round2(list.reduce((n, x) => n + x.monthly, 0));
    return { list: list.sort((a, b) => b.monthly - a.monthly), monthly, yearly: round2(monthly * 12) };
  }
  /* Spending by how it was paid, with refunds taken off. */
  function methodTotals(list) {
    const map = new Map();
    for (const e of list) { const v = spendOf(e); if (!v) continue; const k = e.method || "other"; const x = map.get(k) || { id: k, total: 0, count: 0 }; x.total += v; if (e.type === "expense") x.count++; map.set(k, x); }
    return [...map.values()].map((x) => ({ ...x, total: round2(x.total) })).filter((x) => x.total > 0).sort((a, b) => b.total - a.total);
  }
  /* Money you can spend now (cash, bank and wallets), what you owe on cards, and what's put aside. */
  function liquidity(bal = balances()) {
    let available = 0, cardOwed = 0, saved = 0;
    for (const a of state.accounts) {
      const b = bal.get(a.id) || 0;
      if (a.type === "cash" || a.type === "bank" || a.type === "wallet") available += b;
      else if (a.type === "card") { if (b < 0) cardOwed -= b; }
      else saved += b;
    }
    return { available: round2(available), cardOwed: round2(cardOwed), saved: round2(saved) };
  }
  /* ---------- other currencies ---------- */
  function symbolFor(cur) { try { return nf(cur, 0).formatToParts(0).find((p) => p.type === "currency")?.value || cur; } catch { return cur; } }
  /* Rates can need more than two decimals (1 JPY = 0.5512 INR). A comma works as the decimal mark too. */
  function parseRate(v) { const s = String(v ?? "").trim().replace(/\s/g, "").replace(/,(?=\d+$)/, ".").replace(/,/g, ""); const n = Number(s); return Number.isFinite(n) && n > 0 && n < 1e7 ? Number(n.toPrecision(8)) : 0; }
  function fxText(d) {
    if (!d.cur) return "";
    const orig = parseAmount(d.amount), rate = parseRate(d.rate);
    if (!(orig > 0) || !(rate > 0)) return "Type the rate to see the amount in " + state.settings.currency + ".";
    return `= ${money(round2(orig * rate))}, which is what counts in your totals`;
  }
  const METHOD_COLORS = { upi: "#0E7490", debit: "#1D4ED8", credit: "#3F3F46", cash: "#15803D", bank: "#4338CA", wallet: "#7C3AED", other: "#52525B" };

  /* ================= smart features: all worked out from your own entries, nothing is sent anywhere ================= */

  /* ---------- automatic categories ---------- */
  /* Words that point to a category. Your own past entries always win over this list. */
  const KEYWORDS = {
    food: "food lunch dinner breakfast brunch coffee cafe café tea chai snack snacks restaurant pizza burger biryani dosa idli thali swiggy zomato takeaway meal meals canteen bakery dessert icecream juice starbucks kfc mcdonalds dominos subway ramen sushi noodles latte croissant",
    groceries: "grocery groceries supermarket vegetables veggies fruit fruits milk bread eggs blinkit zepto bigbasket instamart dmart kirana provisions",
    transport: "uber ola rapido taxi cab auto rickshaw metro bus fuel petrol diesel cng parking toll fastag ride commute",
    housing: "rent maintenance society landlord plumber electrician furniture",
    bills: "electricity power water gas lpg cylinder internet broadband wifi phone mobile recharge postpaid prepaid bill dth airtel jio vodafone bsnl",
    subscriptions: "subscription netflix spotify prime hotstar disney youtube icloud membership sonyliv zee5 jiocinema",
    shopping: "amazon flipkart myntra ajio meesho nykaa clothes clothing shirt tshirt shoes sneakers jeans jacket hoodie kurta saree dress bag watch electronics gadget headphones charger shopping mall",
    health: "doctor hospital clinic medicine medicines pharmacy chemist apollo medplus pharmeasy 1mg lab dentist gym fitness yoga protein vitamins",
    entertainment: "movie movies cinema pvr inox bookmyshow concert show game games gaming steam playstation party club bowling",
    travel: "flight flights airline indigo vistara hotel hostel airbnb oyo makemytrip goibibo irctc train trip holiday vacation visa luggage",
    education: "course courses tuition fees school college books book udemy coursera exam stationery",
    gifts: "gift gifts donation charity present birthday wedding",
    care: "haircut salon spa barber grooming cosmetics skincare parlour",
    salary: "salary payroll paycheck stipend wages",
    freelance: "freelance invoice client project consulting gig",
    interest: "interest dividend dividends returns",
  };
  const KEYWORD_INDEX = (() => {
    const map = new Map();
    for (const [cat, words] of Object.entries(KEYWORDS)) for (const w of words.split(" ")) if (!map.has(w)) map.set(w, cat);
    return map;
  })();
  const normTitle = (s) => String(s || "").toLowerCase().replace(/[0-9]+/g, " ").replace(/[^\p{L}\s]/gu, " ").replace(/\s+/g, " ").trim();
  const words = (s) => normTitle(s).split(" ").filter((w) => w.length > 1);
  /* Past titles and the category you gave them. */
  function titleHistory(kind) {
    const map = new Map();
    for (const e of state.entries) {
      if (TYPES[e.type].cat !== kind || !e.title || !e.category) continue;
      const k = normTitle(e.title);
      if (!k) continue;
      const counts = map.get(k) || new Map();
      counts.set(e.category, (counts.get(e.category) || 0) + 1);
      map.set(k, counts);
    }
    return map;
  }
  const topOf = (counts) => [...counts.entries()].sort((a, b) => b[1] - a[1])[0]?.[0];
  /* The best category for some text, and where the guess came from. */
  function guessCategory(text, kind = "expense") {
    const key = normTitle(text);
    if (!key) return null;
    const valid = (id) => state.categories.some((c) => c.id === id && c.kind === kind);
    const hist = titleHistory(kind);
    if (hist.has(key) && valid(topOf(hist.get(key)))) return { id: topOf(hist.get(key)), from: "history" };
    let best = null;
    for (const [k, counts] of hist) {
      if (k.length < 3 || !(key.startsWith(k + " ") || k.startsWith(key + " ") || (key.split(" ")[0].length >= 4 && k.split(" ")[0] === key.split(" ")[0]))) continue;
      const total = [...counts.values()].reduce((a, b) => a + b, 0);
      if (!best || total > best.total) best = { counts, total };
    }
    if (best && valid(topOf(best.counts))) return { id: topOf(best.counts), from: "history" };
    const ws = words(text);
    // Your own category names, then the word list
    for (const c of state.categories) {
      if (c.kind !== kind || c.id === "other" || c.id === "other-in") continue;
      const nameWords = words(c.name).filter((w) => w.length > 3 && w !== "home");
      if (nameWords.some((w) => ws.includes(w))) return { id: c.id, from: "words" };
    }
    const hits = new Map();
    for (const w of ws) { const cat = KEYWORD_INDEX.get(w); if (cat && valid(cat)) hits.set(cat, (hits.get(cat) || 0) + 1); }
    const top = [...hits.entries()].sort((a, b) => b[1] - a[1])[0];
    return top ? { id: top[0], from: "words" } : null;
  }

  /* ---------- typed entries, like "Spent ₹250 on food today" ---------- */
  const MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
  const WEEKDAYS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
  const CUR_WORDS = { "₹": "INR", rs: "INR", inr: "INR", rupees: "INR", rupee: "INR", "$": "USD", usd: "USD", dollars: "USD", "€": "EUR", eur: "EUR", euros: "EUR", "£": "GBP", gbp: "GBP", pounds: "GBP" };
  function parseQuick(input) {
    const raw = String(input || "").trim();
    let s = " " + raw.toLowerCase().replace(/[“”"]/g, " ").replace(/\s+/g, " ") + " ";
    const out = { type: "", amount: 0, title: "", category: "", date: todayISO(), dateSaid: false, account: "", method: "", person: "", cur: "" };
    const t = todayISO();
    const cut = (re) => { s = s.replace(re, " "); };

    // When
    let m;
    if (/\bday before yesterday\b/.test(s)) { out.date = addDays(t, -2); out.dateSaid = true; cut(/\b(on )?day before yesterday\b/); }
    else if (/\byesterday\b/.test(s)) { out.date = addDays(t, -1); out.dateSaid = true; cut(/\b(on )?yesterday\b/); }
    else if (/\btoday\b|\btonight\b|\bthis morning\b/.test(s)) { out.dateSaid = true; cut(/\b(today|tonight|this morning)\b/); }
    else if ((m = s.match(/\b(\d{1,3}) days? ago\b/))) { out.date = addDays(t, -Number(m[1])); out.dateSaid = true; cut(/\b\d{1,3} days? ago\b/); }
    else if ((m = s.match(/\b(\d{4})-(\d{2})-(\d{2})\b/)) && isDate(m[0])) { out.date = m[0]; out.dateSaid = true; cut(/\b(on )?\d{4}-\d{2}-\d{2}\b/); }
    else if ((m = s.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/) || s.match(/\b(\d{1,2})\.(\d{1,2})\.(\d{2,4})\b/))) {
      const us = /^en-us$/i.test(LOCALE);
      const dd = Number(us ? m[2] : m[1]), mm = Number(us ? m[1] : m[2]);
      let yy = m[3] ? Number(m[3]) : Number(t.slice(0, 4)); if (yy < 100) yy += 2000;
      if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) { out.date = dayInMonth(`${yy}-${pad(mm)}`, dd); if (!m[3] && out.date > t) out.date = dayInMonth(`${yy - 1}-${pad(mm)}`, dd); out.dateSaid = true; cut(new RegExp(`\\b(on )?${m[0].replace(/[.]/g, "\\.")}\\b`)); }
    }
    else if ((m = s.match(new RegExp(`\\b(\\d{1,2})(?:st|nd|rd|th)? (?:of )?(${MONTHS.join("|")})[a-z]*\\b|\\b(${MONTHS.join("|")})[a-z]* (\\d{1,2})(?:st|nd|rd|th)?\\b`)))) {
      const dd = Number(m[1] || m[4]), mon = MONTHS.indexOf((m[2] || m[3]).slice(0, 3)) + 1;
      let yy = Number(t.slice(0, 4));
      out.date = dayInMonth(`${yy}-${pad(mon)}`, dd);
      if (out.date > t) out.date = dayInMonth(`${yy - 1}-${pad(mon)}`, dd);
      out.dateSaid = true; cut(new RegExp(`\\b(on )?${m[0]}\\b`));
    }
    else if ((m = s.match(new RegExp(`\\b(?:on |last )?(${WEEKDAYS.join("|")})(?:day|sday|nesday|rsday|urday|s|r|rs)?\\b`)))) {
      const target = WEEKDAYS.indexOf(m[1]);
      let d = t;
      for (let i = 0; i < 7; i++) { d = addDays(t, -i); if (parseISO(d).getDay() === target) break; }
      if (/last/.test(m[0]) && d === t) d = addDays(t, -7);
      out.date = d; out.dateSaid = true; cut(new RegExp(`\\b${m[0]}\\b`));
    }

    // How much
    m = s.match(/(₹|\$|€|£)?\s*\b(rs\.?|inr|usd|eur|gbp)?\s*(\d[\d,]*(?:\.\d{1,2})?)\s*(k|thousand|lakh|lac|lakhs)?\b\s*(rupees?|dollars?|euros?|pounds?|rs|inr)?/);
    if (m) {
      let n = parseFloat(m[3].replace(/,/g, ""));
      const mult = m[4] ? (m[4].startsWith("k") || m[4] === "thousand" ? 1e3 : 1e5) : 1;
      n *= mult;
      if (n > 0) out.amount = round2(n);
      const cw = (m[1] || m[2] || m[5] || "").replace(".", "");
      if (CUR_WORDS[cw] && CUR_WORDS[cw] !== state.settings.currency) out.cur = CUR_WORDS[cw];
      s = s.replace(m[0], " ");
    }

    // What kind of entry
    const rules = [
      ["collected", /\b(paid me back|gave me back|got back|returned (?:the |my )?money)\b/],
      ["repaid", /\b(paid back|repaid|returned to)\b/],
      ["lent", /\b(lent|loaned)\b/],
      ["borrowed", /\b(borrowed)\b/],
      ["refund", /\b(refund|refunded|cashback)\b/],
      ["transfer", /\b(transferred|transfer|moved)\b/],
      ["income", /\b(got paid|received|earned|salary|income|credited|bonus)\b/],
      ["expense", /\b(spent|paid|bought|purchased|spend|cost)\b/],
    ];
    for (const [type, re] of rules) if (re.test(s)) { out.type = type; break; }
    if (!out.type) out.type = "expense";

    // Who, for money between people
    if (TYPES[out.type].person) {
      const pm = out.type === "collected" ? raw.match(/^\s*([A-Z][\p{L}'-]+(?: [A-Z][\p{L}'-]+)?)\s+(?:paid|gave|returned)/u) || raw.match(/\bfrom ([A-Z][\p{L}'-]+(?: [A-Z][\p{L}'-]+)?)/u)
        : out.type === "borrowed" ? raw.match(/\bfrom ([\p{L}][\p{L}'-]*(?: [A-Z][\p{L}'-]+)?)/u)
        : raw.match(/\bto ([\p{L}][\p{L}'-]*(?: [A-Z][\p{L}'-]+)?)/u) || raw.match(/\b(?:lent|loaned|paid back|repaid)\s+([A-Z][\p{L}'-]+)/u);
      if (pm) { const name = pm[1].trim(); if (!/^(the|my|a|an|me|him|her|them|for|on)$/i.test(name)) { out.person = name.replace(/(^|\s)\p{Ll}/gu, (c) => c.toUpperCase()); s = s.replace(new RegExp(`\\b(to|from)?\\s*${name.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}\\b`), " "); } }
    }

    // How it was paid, and from which account
    const methodRules = [["upi", /\b(upi|gpay|google pay|phonepe|phone pe|paytm|bhim)\b/], ["debit", /\bdebit card\b/], ["credit", /\b(credit card|card)\b/], ["cash", /\bcash\b/], ["bank", /\b(bank transfer|neft|imps|rtgs|net ?banking)\b/], ["wallet", /\bwallet\b/]];
    for (const [k, re] of methodRules) if (re.test(s)) { out.method = k; s = s.replace(re, " "); break; }
    const live = state.accounts.filter((a) => !a.archived);
    const byName = live.filter((a) => a.name.length > 2).sort((a, b) => b.name.length - a.name.length);
    const mention = (prefix) => byName.find((a) => new RegExp(`\\b${prefix}\\s+(?:my\\s+)?${a.name.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}\\b`).test(s));
    if (out.type === "transfer") {
      const to = mention("(?:to|into)"), from = mention("from");
      if (to) { out.to = to.id; s = s.replace(new RegExp(`\\b(to|into)\\s+(my\\s+)?${to.name.toLowerCase()}\\b`), " "); }
      if (from) { out.account = from.id; s = s.replace(new RegExp(`\\bfrom\\s+(my\\s+)?${from.name.toLowerCase()}\\b`), " "); }
    }
    const named = out.account ? null : byName.find((a) => a.id !== out.to && s.includes(" " + a.name.toLowerCase() + " "));
    if (named) { out.account = named.id; s = s.replace(named.name.toLowerCase(), " "); }
    else if (out.method) {
      const want = { cash: ["cash"], credit: ["card"], wallet: ["wallet"], upi: ["bank", "wallet"], debit: ["bank"], bank: ["bank"] }[out.method] || [];
      out.account = (live.find((a) => want.includes(a.type)) || {}).id || "";
    }
    // What for: the words after "on", "for" or "at", otherwise whatever is left, without filler at either end
    const FILLER = new Set("i i've ive have has just spent spend paid pay bought purchased got received earned lent loaned borrowed transferred moved refund refunded back me to from the a an via by using with through my for on at in of and was is worth rupee rupees rs inr dollar dollars euro euros pound pounds".split(" "));
    const phrase = (s.match(/\b(?:on|for|at)\s+([^]+?)\s*$/) || [])[1] || s;
    const ws = phrase.replace(/[^\p{L}\p{N}&' -]/gu, " ").split(/\s+/).filter(Boolean);
    while (ws.length && FILLER.has(ws[0])) ws.shift();
    while (ws.length && FILLER.has(ws[ws.length - 1])) ws.pop();
    let title = ws.join(" ");
    const kind = TYPES[out.type].cat;
    if (kind) {
      const g = guessCategory(title || raw, kind) || guessCategory(raw, kind);
      out.category = g ? g.id : "";
      // A title that is only the category's name says nothing more
      const nameWords = words(catById(out.category, kind).name);
      if (out.category && words(title).length && words(title).every((w) => nameWords.includes(w))) title = "";
    } else if (out.type === "transfer") title = "";
    if (title) { const at = raw.toLowerCase().indexOf(title.toLowerCase()); if (at >= 0) title = raw.slice(at, at + title.length); }
    out.title = title ? title[0].toUpperCase() + title.slice(1) : "";
    return out;
  }
  /* A readable summary of what was understood. */
  function quickSummary(q) {
    if (!q.amount) return "";
    const bits = [TYPES[q.type].label, money(q.amount)];
    if (q.cur) bits[1] = `${q.amount} ${q.cur}`;
    if (q.person) bits.push(q.person);
    if (q.title) bits.push(q.title);
    if (q.category) bits.push(catById(q.category, TYPES[q.type].cat).name);
    bits.push(relDay(q.date));
    if (q.method) bits.push(METHODS[q.method]);
    if (q.account) bits.push(acctName(q.account));
    if (q.to) bits.push(`to ${acctName(q.to)}`);
    return bits.join(" · ");
  }

  /* ---------- insights ---------- */
  const median = (xs) => { if (!xs.length) return 0; const a = [...xs].sort((x, y) => x - y), h = a.length >> 1; return a.length % 2 ? a[h] : (a[h - 1] + a[h]) / 2; };
  const discretionary = (list) => list.filter((e) => e.type === "expense" && !e.recurringId);
  /* Spending in a month up to a given day of it, so a part-month can be compared fairly. */
  function spentByDay(m, day, catId = null) {
    const to = `${m}-${pad(Math.min(day, daysInMonth(m)))}`;
    let n = 0;
    for (const e of state.entries) if (e.date >= `${m}-01` && e.date <= to && (!catId || e.category === catId)) n += spendOf(e);
    return round2(n);
  }
  /* What you're on course to spend this month: spending so far, plus your usual daily spending for the days left,
     plus bills still to come. Early in the month it leans on the last three months instead of a few days. */
  function forecastMonth(m = monthOf(todayISO())) {
    const t = todayISO(), days = daysInMonth(m), day = m === monthOf(t) ? Number(t.slice(8)) : days;
    const list = entriesIn(m), spent = Math.max(0, totals(list).spent);
    const discSoFar = sum(discretionary(list).filter((e) => e.date <= t).map((e) => e.amount));
    const past = [1, 2, 3].map((i) => addMonths(m, -i)).filter((mm) => entriesIn(mm).length);
    const pastDaily = past.length ? sum(past.map((mm) => sum(discretionary(entriesIn(mm)).map((e) => e.amount)) / daysInMonth(mm))) / past.length : 0;
    const thisDaily = day ? discSoFar / day : 0;
    const w = past.length ? Math.min(1, day / 14) : 1;
    const daily = thisDaily * w + pastDaily * (1 - w);
    const bills = billsIn(m, t);
    const left = days - day;
    const projected = round2(spent + daily * left + bills.unpaid);
    return { projected, daily: round2(daily), billsLeft: bills.unpaid, day, days, past: past.length };
  }
  /* Things worth knowing about a month, most important first. Each says how it was worked out. */
  function findInsights(m = monthOf(todayISO())) {
    const t = todayISO(), out = [], isCur = m === monthOf(t);
    const list = entriesIn(m), { spent, income } = totals(list);
    if (!list.length) return out;
    const day = isCur ? Number(t.slice(8)) : daysInMonth(m);
    const past = [1, 2, 3].map((i) => addMonths(m, -i)).filter((mm) => entriesIn(mm).length);
    const B = budgetFor(m);

    // 1. Where the month is heading
    if (isCur && day < daysInMonth(m)) {
      const f = forecastMonth(m);
      const avg = past.length ? sum(past.map((mm) => Math.max(0, totals(entriesIn(mm)).spent))) / past.length : 0;
      const how = `Your spending so far (${W(spent)}), plus about ${W(f.daily)} a day for the ${plural(f.days - f.day, "day")} left${f.billsLeft ? `, plus ${W(f.billsLeft)} of bills still due` : ""}.${f.past && f.day < 14 ? " Early in the month this leans on your last three months." : ""}`;
      if (B.total > 0 && f.projected > B.total) out.push({ id: "forecast", tone: "bad", title: `On course for ${W(f.projected)} this month`, body: `That's ${W(f.projected - B.total)} over your ${W(B.total)} budget. Spending about ${W(Math.max(0, (B.total - spent - f.billsLeft) / Math.max(1, f.days - f.day)))} a day from now on keeps you within it.`, how });
      else if (B.total > 0) out.push({ id: "forecast", tone: "good", title: `On course for ${W(f.projected)} this month`, body: `That leaves about ${W(B.total - f.projected)} of your ${W(B.total)} budget unspent.`, how });
      else out.push({ id: "forecast", tone: "info", title: `On course for ${W(f.projected)} this month`, body: avg ? `Your average over the last ${plural(past.length, "month")} was ${W(avg)}.` : "Set a monthly budget to see how that compares.", how });
    }

    // 2. Spending more than came in
    if (income > 0 && spent > income) out.push({ id: "overspend", tone: "bad", title: "Spending more than came in", body: `${W(spent)} went out against ${W(income)} in. That's ${W(spent - income)} more than you earned this month.`, how: "Spending is your expenses minus refunds. Income counts only entries marked as income, not transfers or money borrowed." });

    // 3. Categories ahead of their usual pace, or over their budget
    if (past.length) {
      const cats = catTotals(list);
      const flagged = [];
      for (const ct of cats) {
        const usual = sum(past.map((mm) => spentByDay(mm, day, ct.id))) / past.length;
        const now = spentByDay(m, day, ct.id);
        const floor = Math.max(spent * 0.03, 1);
        if (usual > 0 && now > usual * 1.3 && now - usual >= floor) flagged.push({ ct, now, usual });
      }
      flagged.sort((a, b) => (b.now - b.usual) - (a.now - a.usual));
      for (const x of flagged.slice(0, 2)) {
        const c = catById(x.ct.id);
        out.push({ id: "cat-" + c.id, tone: "warn", title: `More on ${c.name} than usual`, body: `${W(x.now)} so far${isCur ? `, by day ${day}` : ""}. Over the last ${plural(past.length, "month")} you'd usually spent ${W(x.usual)} by this point, so that's ${Math.round((x.now / x.usual - 1) * 100)}% more.`, how: `Compares spending in ${c.name} up to day ${day} of this month with the average up to the same day of the ${plural(past.length, "month")} before.`, act: `data-act="go-cat" data-cat="${esc(c.id)}"` });
      }
    }
    for (const b of budgetStatus(m)) {
      if (!b.id || b.level < 100) continue;
      out.push({ id: "over-" + b.id, tone: "bad", title: `${b.name} is over budget`, body: `${W(b.spent)} spent against a ${W(b.total)} limit, ${W(b.spent - b.total)} over.`, how: "From the category budgets you set under Budgets.", act: `data-act="go-cat" data-cat="${esc(b.id)}"` });
    }

    // 4. One-off spending far above what's normal for its category
    const from = addDays(`${m}-01`, -90);
    const unusual = [];
    for (const e of discretionary(list)) {
      const prior = state.entries.filter((x) => x.type === "expense" && !x.recurringId && x.category === e.category && x.date >= from && x.date < `${m}-01`).map((x) => x.amount);
      if (prior.length < 5) continue;
      const med = median(prior);
      if (med > 0 && e.amount >= med * 3 && e.amount >= Math.max(spent * 0.02, med + 1)) unusual.push({ e, med, x: e.amount / med });
    }
    unusual.sort((a, b) => b.e.amount - a.e.amount);
    for (const u of unusual.slice(0, 2)) {
      const c = catById(u.e.category);
      out.push({ id: "odd-" + u.e.id, tone: "info", title: `An unusually big ${c.name.toLowerCase()} spend`, body: `${W(u.e.amount)} on ${entryTitle(u.e)}, ${fDate(u.e.date)}. That's about ${Math.round(u.x)} times your usual ${c.name.toLowerCase()} spend of ${W(u.med)}.`, how: `Flags spending at least three times the typical (median) amount you spent in ${c.name} over the previous 90 days.`, act: `data-act="edit-entry" data-id="${esc(u.e.id)}"` });
    }

    // 5. Small things that add up
    const since = addDays(isCur ? t : `${m}-${pad(daysInMonth(m))}`, -29);
    const groups = new Map();
    for (const e of state.entries) {
      if (e.type !== "expense" || e.recurringId || e.date < since || e.date > (isCur ? t : `${m}-${pad(daysInMonth(m))}`)) continue;
      const k = normTitle(e.title).split(" ")[0] || "";
      if (k.length < 3) continue;
      const g = groups.get(k) || { k, n: 0, total: 0, title: e.title, cat: e.category };
      g.n++; g.total += e.amount; groups.set(k, g);
    }
    const habit = [...groups.values()].filter((g) => g.n >= 8).sort((a, b) => b.total - a.total)[0];
    if (habit) out.push({ id: "habit", tone: "info", title: `${habit.n} × “${habit.k}” in the last 30 days`, body: `That's ${W(habit.total)}. Cutting it by half would save about ${W(habit.total / 2)} a month, or ${W(habit.total * 6)} a year.`, how: "Groups the last 30 days of everyday spending by its description and picks the most frequent one that you bought eight times or more." });

    // 6. Subscriptions
    const subs = subscriptions();
    if (subs.list.length >= 2) out.push({ id: "subs", tone: "info", title: `${W(subs.monthly)} a month on subscriptions`, body: `${plural(subs.list.length, "subscription")} cost ${W(subs.yearly)} a year. The biggest is ${subs.list[0].r.name} at ${W(subs.list[0].monthly)} a month. Cancelling one you rarely use is the easiest saving.`, how: "Adds up active recurring payments in the Subscriptions category, converting yearly and quarterly ones to a monthly amount.", act: `data-act="go-subs"` });

    // 7. Against earlier months
    if (past.length) {
      const before = sum(past.map((mm) => spentByDay(mm, day))) / past.length;
      const now = spentByDay(m, day);
      if (before > 0 && Math.abs(now - before) / before >= 0.1) {
        const up = now > before;
        out.push({ id: "trend", tone: up ? "warn" : "good", title: up ? "Spending more than your usual month" : "Spending less than your usual month", body: `${W(now)} by day ${day}, against an average of ${W(before)} at the same point of the last ${plural(past.length, "month")}. That's ${Math.round(Math.abs(now / before - 1) * 100)}% ${up ? "more" : "less"}.`, how: "Compares spending up to today's date with the same days of earlier months, so a part-month is compared fairly." });
      }
    }

    // 8. No-spend days
    if (isCur) {
      const ns = noSpendStats(`${m}-01`, t);
      if (ns.count >= 3) out.push({ id: "nospend", tone: "good", title: `${ns.count} no-spend days so far`, body: `Your longest run this month is ${plural(ns.longest, "day")}. Days with only recurring bills count as no-spend days.`, how: "Counts days with no spending apart from recurring bills, from your first entry onwards.", act: `data-act="go-calendar"` });
    }

    const rank = { bad: 0, warn: 1, info: 2, good: 3 };
    return out.sort((a, b) => rank[a.tone] - rank[b.tone]);
  }

  /* ---------- financial health score ---------- */
  /* Five parts, each out of 20. A part you have no data for is left out, and the rest are scaled to 100.
     It's worked out only from what you've entered here, and it is not a credit score. */
  function healthScore() {
    const t = todayISO(), cur = monthOf(t);
    let months = [1, 2, 3].map((i) => addMonths(cur, -i)).filter((m) => entriesIn(m).length);
    const partial = !months.length;
    if (partial && entriesIn(cur).length) months = [cur];
    const parts = [];
    const pct = (x) => Math.round(x * 100);
    const clamp01 = (x) => Math.max(0, Math.min(1, x));
    const span = months.length ? `${plural(months.length, "month")}` : "";
    const monthTotals = months.map((m) => totals(entriesIn(m)));
    const avgSpend = monthTotals.length ? sum(monthTotals.map((x) => Math.max(0, x.spent))) / monthTotals.length : 0;
    const avgIncome = monthTotals.length ? sum(monthTotals.map((x) => x.income)) / monthTotals.length : 0;

    // Savings rate: 20% or more of income kept scores full marks
    const withIncome = monthTotals.filter((x) => x.income > 0);
    if (withIncome.length) {
      const rate = sum(withIncome.map((x) => x.income - x.spent)) / sum(withIncome.map((x) => x.income));
      parts.push({ id: "save", name: "Savings rate", pts: clamp01(rate / 0.2) * 20, value: rate >= 0 ? `You keep ${pct(rate)}% of what comes in` : `You spend ${pct(-rate)}% more than comes in`, tip: rate >= 0.2 ? "" : `Keeping 20% of your income scores full marks. That's about ${W(Math.max(0, avgIncome * 0.2 - (avgIncome - avgSpend)))} a month more than now.`, how: `Income minus spending, divided by income, over the last ${span}. 20% or more scores 20.` });
    } else parts.push({ id: "save", name: "Savings rate", pts: null, value: "No income logged yet", tip: "Add your income so this can be worked out.", how: "Income minus spending, divided by income. 20% or more scores 20." });

    // Budget discipline: share of months, and of category budgets, kept within their limit
    const checks = [];
    for (const m of months) for (const b of budgetStatus(m)) checks.push(b.spent <= b.total);
    if (checks.length) {
      const kept = checks.filter(Boolean).length / checks.length;
      parts.push({ id: "budget", name: "Budget discipline", pts: kept * 20, value: `${checks.filter(Boolean).length} of ${checks.length} budgets kept`, tip: kept >= 1 ? "" : "Check the categories that went over and either spend less there or set a more realistic limit.", how: `Every monthly and category budget over the last ${span}, counting how many you stayed within.` });
    } else parts.push({ id: "budget", name: "Budget discipline", pts: null, value: "No budgets set", tip: "Set a monthly budget, or a few category budgets, to score this.", how: "Every monthly and category budget, counting how many you stayed within." });

    // Spending consistency: how much everyday spending swings from month to month
    const disc = months.map((m) => sum(discretionary(entriesIn(m)).map((e) => e.amount)));
    if (disc.length >= 2 && !partial) {
      const mean = sum(disc) / disc.length, sd = Math.sqrt(disc.reduce((n, x) => n + (x - mean) ** 2, 0) / disc.length);
      const cv = mean > 0 ? sd / mean : 0;
      parts.push({ id: "steady", name: "Spending consistency", pts: clamp01((0.5 - cv) / 0.4) * 20, value: `Everyday spending varies by about ${pct(cv)}% a month`, tip: cv <= 0.1 ? "" : "Big swings usually come from one-off purchases. Planning for them, for example with a goal, smooths things out.", how: "How much everyday spending (not recurring bills) changes between months. A change of 10% or less scores 20, 50% or more scores 0." });
    } else parts.push({ id: "steady", name: "Spending consistency", pts: null, value: "Needs two full months", tip: "This appears once you have two full months of entries.", how: "How much everyday spending changes between months." });

    // Debt: what you owe on cards and to people, against a month's income
    const bal = balances(), liq = liquidity(bal), ppl = people();
    const owe = liq.cardOwed + sum(ppl.filter((p) => p.balance < 0).map((p) => -p.balance));
    const late = ppl.filter((p) => p.balance < 0 && debtStatus(p)?.overdue).length;
    const base = avgIncome || avgSpend;
    if (months.length && (base > 0 || owe === 0)) {
      const ratio = base > 0 ? owe / base : 0;
      parts.push({ id: "debt", name: "Debt management", pts: Math.max(0, clamp01(1 - ratio) * 20 - late * 5), value: owe ? `You owe ${W(owe)}, ${pct(ratio)}% of a month's ${avgIncome ? "income" : "spending"}${late ? `, with ${plural(late, "repayment")} overdue` : ""}` : "You don't owe anything", tip: owe === 0 ? "" : late ? "Pay back what's overdue first: each late repayment costs 5 points." : "Paying off card balances in full each month keeps this high.", how: "What you owe on credit cards and to people, compared with a month's income. Owing nothing scores 20; owing a month's income or more scores 0. Each overdue repayment takes off 5." });
    }

    // Emergency savings: savings, investments and goals against three months of spending
    if (avgSpend > 0) {
      const monthsCovered = liq.saved / avgSpend;
      parts.push({ id: "safety", name: "Emergency savings", pts: clamp01(monthsCovered / 3) * 20, value: `Your savings would cover ${monthsCovered >= 10 ? Math.round(monthsCovered) : monthsCovered.toFixed(1)} months of spending`, tip: monthsCovered >= 3 ? "" : `Three months of spending, about ${W(avgSpend * 3)}, scores full marks. A goal for it helps.`, how: "Money in savings, investment and goal accounts, divided by your average monthly spending. Three months or more scores 20." });
    } else parts.push({ id: "safety", name: "Emergency savings", pts: null, value: "No spending logged yet", tip: "This appears once you've logged a month of spending.", how: "Savings, investments and goals, divided by your average monthly spending." });

    const scored = parts.filter((p) => p.pts !== null);
    const score = scored.length ? Math.round((sum(scored.map((p) => p.pts)) / (scored.length * 20)) * 100) : null;
    const label = score === null ? "Not enough data" : score >= 80 ? "Strong" : score >= 60 ? "Good" : score >= 40 ? "Fair" : "Needs attention";
    const tips = parts.filter((p) => p.tip && p.pts !== null).sort((a, b) => a.pts - b.pts).slice(0, 2);
    return { score, label, parts, tips, partial, months: months.length };
  }

  /* ================= sample data ================= */
  function mulberry32(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  /* Six months of a believable household, scaled to the visitor's currency, so the first screen shows what the app does. */
  function sampleState(keep = null) {
    const currency = keep?.currency || guessCurrency();
    const k = SAMPLE_RATE[currency] || 1;
    const amt = (usd) => {
      const v = usd * k;
      if (ZERO_DEC.includes(currency) || v >= 100) { const step = v >= 20000 ? 100 : v >= 2000 ? 10 : 1; return Math.max(step, Math.round(v / step) * step); }
      return round2(v);
    };
    const s = emptyState(currency, keep?.skin, keep?.mode);
    s.sample = true;
    s.settings.budget = amt(3600);

    const pick = (arr) => arr[Math.floor(rng() * arr.length)];

      newAccount("card", "Credit card", "card", 0),

    ];

    const overdueDate = addDays(t, -3), soonA = addDays(t, 2), soonB = addDays(t, 5);
    const rec = (kind, name, category, usd, frequency, day, startMonth, extra = {}) => ({ id: uid(), kind, name, category, amount: amt(usd), frequency, start: dayInMonth(startMonth, day), day, end: "", variable: false, auto: false, account: "card", to: "", note: "", active: true, paid: {}, ...extra });
    const R = [
      rec("expense", "Rent", "housing", 1450, "monthly", 1, first, { account: "bank" }),
      rec("expense", "Phone plan", "bills", 35, "monthly", Number(overdueDate.slice(8)), first, { _skip: monthOf(overdueDate) }),
      rec("expense", "Electricity", "bills", 86, "monthly", Number(soonA.slice(8)), first, { variable: true, note: "Higher in summer" }),

      rec("expense", "Music streaming", "subscriptions", 10.99, "monthly", 26, first),
      rec("expense", "Gym membership", "health", 42, "monthly", 3, first),
      rec("expense", "Car insurance", "transport", 540, "quarterly", 15, addMonths(cur, -4), { account: "bank" }),
      rec("expense", "Cloud storage", "subscriptions", 29.99, "yearly", 20, addMonths(cur, -11)),
      rec("income", "Salary", "salary", 4300, "monthly", 1, first, { account: "bank" }),
      rec("transfer", "Japan trip savings", "", 250, "monthly", 26, first, { account: "bank", to: "goal-trip" }),
    ];
    const push = (date, type, title, category, usd, account, extra = {}) => s.entries.push({ id: uid(), type, title, amount: amt(round2(usd)), category, date, account, to: "", person: "", note: "", recurringId: null, ...extra });
    const spend = (date, title, category, usd, account = "card", extra) => push(date, "expense", title, category, usd, account, extra);

          else if (r < 0.9) spend(date, "Ride home", "transport", between(9, 26));

      }
      if (`${m}-10` < t) push(`${m}-10`, "transfer", "Cash withdrawal", "", 100, "bank", { to: "cash" });
      if (i > 0) push(`${m}-${pad(daysInMonth(m))}`, "income", "Savings interest", "interest", between(13, 17), "savings");
      if ((i === 4 || i === 2) && `${m}-27` < t) push(`${m}-27`, "transfer", "", "", 150, "bank", { to: "goal-safety" });

    const trip = addMonths(cur, -2);
    spend(`${trip}-12`, "Train tickets", "travel", 128);
    spend(`${trip}-13`, "Weekend hotel", "travel", 264, "card", { note: "Two nights by the coast" });
    spend(`${trip}-13`, "Museum passes", "entertainment", 36);
    push(`${addMonths(cur, -1)}-18`, "income", "Logo design project", "freelance", 350, "bank");

  /* Previous, next and back-to-now for whichever period a view shows. */

  /* A month as a calendar: what went out each day, with no-spend days marked. Recurring bills don't break a no-spend day. */
  function calendarHTML(m, found) {

    if (q) rows = rows.filter((x) => `${x.r.name} ${x.r.category ? catById(x.r.category, x.r.kind).name : ""} ${RKIND[x.r.kind].label} ${x.r.note}`.toLowerCase().includes(q));
    const pausedLast = (a, b) => (a.r.active === false) - (b.r.active === false);
    const cmp = {
      due: (a, b) => pausedLast(a, b) || (a.st?.due || "9").localeCompare(b.st?.due || "9"),
      amount: (a, b) => b.r.amount - a.r.amount,
      name: (a, b) => a.r.name.localeCompare(b.r.name),
      status: (a, b) => pausedLast(a, b) || (a.st?.days ?? 1e9) - (b.st?.days ?? 1e9),
    }[ui.recSort] || (() => 0);
    rows = [...rows].sort(cmp);
    if (!rows.length) { el.innerHTML = `<div class="empty"><h3>No matches</h3><p>Nothing recurring matches this view.</p><button type="button" class="btn" data-act="clear-rec-filters">Show all</button></div>`; return; }
    const head = `<div class="rrow head" role="row"><span role="columnheader">Name</span><span role="columnheader">Next due</span><span role="columnheader">How often</span><span role="columnheader">Account</span><span role="columnheader" class="num">Amount</span><span role="columnheader">Status</span><span role="columnheader"><span class="sr">Actions</span></span></div>`;
    el.innerHTML = `<div class="rtable" role="table" aria-label="Recurring items">${head}${rows.map(({ r, st }) => {
      const K = RKIND[r.kind], on = r.active !== false, s = statusInfo(r, st);
      const c = r.kind === "transfer" ? { name: "Transfer", color: acctColor(acctById(r.to)), icon: "swap" } : catById(r.category, r.kind);
      const where = r.kind === "transfer" ? `${acctName(r.account)} to ${acctName(r.to)}` : acctName(r.account);
      const subBits = [r.kind === "income" ? `Income · ${c.name}` : c.name, r.variable ? "Varies" : "", r.auto ? "Adds itself" : "", r.end ? `Ends ${fDateLong(r.end)}` : "", r.note].filter(Boolean).map(esc).join(" · ");
      const mobile = [st ? `Due ${fDate(st.due)}` : "", FREQ[r.frequency].label, where].filter(Boolean).map(esc).join(" · ");
      const act = !on ? `<button type="button" class="btn small" data-act="toggle-rec" data-id="${esc(r.id)}">${svg("play")}Resume</button>` : st ? `<button type="button" class="btn small primary" data-act="pay" data-id="${esc(r.id)}">${svg("check")}${K.action}</button>` : "";
      return `<div class="rrow${on ? "" : " inactive"}" role="row">
        <div class="c-name" role="cell"><span class="ico" style="--c:${c.color}">${svg(c.icon)}</span><div class="min0"><span class="rname">${esc(r.name)}</span><span class="rsub">${subBits}</span><span class="rsub m-only">${mobile}</span></div></div>
        <div class="c-due" role="cell">${st ? esc(fDateLong(st.due)) : "None"}</div>
        <div class="c-freq" role="cell">${esc(FREQ[r.frequency].label)}</div>
        <div class="c-method" role="cell">${esc(where)}</div>
        <div class="c-amt num${r.kind === "income" ? " in" : ""}" role="cell">${r.variable ? `<span class="rsub">about </span>` : ""}${r.kind === "income" ? "+" : ""}${esc(money(r.amount))}</div>
        <div class="c-status" role="cell"><span class="pill ${s.cls}">${esc(s.text)}</span></div>
        <div class="c-act" role="cell">${act}<button type="button" class="icon-btn sm" data-act="rec-menu" data-id="${esc(r.id)}" aria-label="More actions for ${esc(r.name)}" aria-haspopup="menu">${svg("more")}</button></div>
      </div>`;
    }).join("")}</div>`;
  }

  /* ---------- wallet: accounts, goals and people ---------- */
  function renderWallet() {
    const bal = balances(), ppl = people(), wo = worth(bal, ppl);
    const live = state.accounts.filter((a) => !a.archived);
    const accts = live.filter((a) => a.type !== "goal"), goals = live.filter((a) => a.type === "goal");
    const archived = state.accounts.filter((a) => a.archived);
    const targets = sum(goals.map((a) => a.target));
    const prow = (p) => {
      const tone = p.balance > 0 ? "in" : p.balance < 0 ? "warn" : "";
      const text = p.balance > 0 ? `Owes you ${money(p.balance)}` : p.balance < 0 ? `You owe ${money(-p.balance)}` : "Settled up";
      const initials = p.name.trim().split(/\s+/).slice(0, 2).map((w) => [...w][0]).join("").toUpperCase();
      const ds = debtStatus(p), dueText = ds ? debtText(ds) || `Due ${fDate(p.due)}` : "";
      return `<div class="prow"><button type="button" class="pmain" data-act="person" data-k="${esc(p.key)}" aria-label="${esc(`${p.name}. ${text}${dueText ? `. ${dueText}` : ""}. Show history`)}"><span class="avatar" aria-hidden="true">${esc(initials)}</span><span class="min0"><span class="item-title">${esc(p.name)}</span><span class="item-meta">${plural(p.count, "entry", "entries")} · last ${esc(fDate(p.last))}</span></span></button>${dueText ? `<span class="pill ${ds.overdue ? "overdue" : ds.soon ? "soon" : "paused"}">${esc(dueText)}</span>` : ""}<span class="p-bal ${tone}">${esc(text)}</span>${p.balance ? `<button type="button" class="btn small" data-act="settle" data-k="${esc(p.key)}">Settle up</button>` : ""}</div>`;
    };
    $("#view-wallet").innerHTML = `<div class="wrap view-body">
      <header class="view-head"><div><p class="eyebrow">Wallet · Net worth</p><h1 class="large-title">${esc(signed(wo.net))}</h1><p class="view-sub">Everything in your accounts and goals, plus what you're owed, minus what you owe.</p></div></header>
      <div class="kpis">
        ${kpi("In accounts and goals", W(wo.assets), `${plural(accts.length, "account")} and ${plural(goals.length, "goal")}`)}
        ${kpi("You owe", W(wo.debts + wo.owe), wo.debts + wo.owe > 0 ? [wo.debts > 0 ? `${W(wo.debts)} on cards and overdrafts` : "", wo.owe > 0 ? `${W(wo.owe)} to people` : ""].filter(Boolean).join(", ") : "Nothing. Nice.", wo.debts + wo.owe > 0 ? "warn" : "")}
        ${kpi("Owed to you", W(wo.owed), wo.owed > 0 ? `By ${plural(ppl.filter((p) => p.balance > 0).length, "person", "people")}` : "Nobody owes you", wo.owed > 0 ? "good" : "")}
        ${kpi("Saved in goals", W(wo.goals), targets > 0 ? `${Math.round((wo.goals / targets) * 100)}% of ${W(targets)} in targets` : "No goals yet")}
      </div>
      <section class="sec"><div class="sec-head"><div><h2>Accounts</h2><p>Where your money sits. Tap one to edit it or see its activity.</p></div><button type="button" class="btn" data-act="add-acct">${svg("plus")}Add account</button></div>
        ${accts.length ? `<div class="acct-grid">${accts.map((a) => acctCard(a, bal.get(a.id) || 0)).join("")}</div>` : `<div class="empty"><h3>No accounts</h3><p>Add the places you keep money: cash, a bank account, a card.</p></div>`}</section>
      <section class="sec"><div class="sec-head"><div><h2>Goals</h2><p>Money you're putting aside for something. Add to a goal with a transfer.</p></div><button type="button" class="btn" data-act="add-goal">${svg("plus")}Add goal</button></div>
        ${goals.length ? `<div class="acct-grid">${goals.map((a) => goalCard(a, bal.get(a.id) || 0)).join("")}</div>` : `<div class="empty"><h3>Saving for something?</h3><p>Set a target, move money into it when you can, and watch it fill up.</p><button type="button" class="btn primary" data-act="add-goal">${svg("plus")}Add goal</button></div>`}</section>
      <section class="sec"><div class="sec-head"><div><h2>People</h2><p>Money you've lent or borrowed. It stays out of your spending and income.</p></div><button type="button" class="btn" data-act="lend">${svg("plus")}Lent or borrowed</button></div>
        ${ppl.length ? `<div class="list">${ppl.map(prow).join("")}</div>` : `<div class="empty"><h3>Nobody owes anybody</h3><p>When you lend or borrow money, add it here and settle up later.</p></div>`}</section>
      ${archived.length ? `<section class="sec"><div class="sec-head"><div><h2>Archived</h2><p>Hidden from pickers, still counted in your totals.</p></div></div><div class="list">${archived.map((a) => `<div class="prow"><span class="pmain static"><span class="ico" style="--c:${acctColor(a)}">${svg((ACCT[a.type] || ACCT.bank).icon)}</span><span class="min0"><span class="item-title">${esc(a.name)}</span><span class="item-meta">${esc((ACCT[a.type] || ACCT.bank).label)}</span></span></span><span class="p-bal">${esc(balText(a, bal.get(a.id) || 0))}</span><button type="button" class="btn small" data-act="restore-acct" data-id="${esc(a.id)}">Restore</button></div>`).join("")}</div></section>` : ""}
    </div>`;
  }

  function niceScale(max) {
    if (!(max > 0)) return { top: 1, step: 0.25 };
    const raw = max / 4;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const f = raw / p;
    const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
    return { top: Math.ceil(max / step - 1e-9) * step, step };
  }
  function vchart({ values, labels, tips, showLabel, emph = () => false, valueLabel = () => "", ref = 0, refLabel = "", cls = "", aria }) {
    const { top, step } = niceScale(Math.max(...values, ref));
    let grid = "";
    for (let v = 0; v <= top + step / 2; v += step) grid += `<div class="gl" style="bottom:${(v / top) * 100}%"><span>${esc(compact(v))}</span></div>`;
    const cols = values.map((v, i) => {
      const h = v > 0 ? Math.max(1.5, (v / top) * 100) : 0;
      const lab = valueLabel(i);
      return `<div class="col${emph(i) ? " emph" : ""}" data-tip="${esc(tips[i])}"><div class="bar" style="height:${h}%"></div>${lab ? `<span class="vlab" style="--h:${h}%">${esc(lab)}</span>` : ""}</div>`;
    }).join("");
    const refEl = ref > 0 && ref <= top ? `<div class="refline" style="bottom:${(ref / top) * 100}%">${refLabel ? `<span>${esc(refLabel)}</span>` : ""}</div>` : "";
    return `<div class="vchart ${cls}" role="img" aria-label="${esc(aria)}"><div class="plot">${grid}${refEl}<div class="cols">${cols}</div></div><div class="xl" aria-hidden="true">${labels.map((l, i) => `<span>${showLabel(i) ? esc(l) : ""}</span>`).join("")}</div></div>`;
  }
  /* Money in against money out, month by month. Two series, so it carries a legend and a table. */
  function flowChart(months, mt) {
    const inc = mt.map((x) => x.income), out = mt.map((x) => Math.max(0, x.spent));
    const { top, step } = niceScale(Math.max(...inc, ...out));
    let grid = "";
    for (let v = 0; v <= top + step / 2; v += step) grid += `<div class="gl" style="bottom:${(v / top) * 100}%"><span>${esc(compact(v))}</span></div>`;
    const h = (v) => (v > 0 ? Math.max(1.5, (v / top) * 100) : 0);
    const cols = months.map((mm, i) => `<div class="col pair" data-tip="${esc(`${fMonth(mm)} · In ${money(inc[i])} · Spent ${money(out[i])}`)}"><div class="bar b-in" style="height:${h(inc[i])}%"></div><div class="bar b-out" style="height:${h(out[i])}%"></div></div>`).join("");
    const rows = months.map((mm, i) => `<tr><td>${esc(fMonth(mm))}</td><td>${esc(money(inc[i]))}</td><td>${esc(money(out[i]))}</td><td>${esc(signed(mt[i].net))}</td></tr>`).join("");
    return `<div class="legend" aria-hidden="true"><span><i class="k-in"></i>Came in</span><span><i class="k-out"></i>Spent</span></div>
      <div class="vchart flow" role="img" aria-label="${esc(`Money in and money spent for the six months to ${fMonth(months[5])}: ${months.map((mm, i) => `${fMon(mm)} in ${W(inc[i])}, spent ${W(out[i])}`).join("; ")}.`)}"><div class="plot">${grid}<div class="cols">${cols}</div></div><div class="xl" aria-hidden="true">${months.map((mm) => `<span>${esc(fMon(mm))}</span>`).join("")}</div></div>
      <details class="tbl wide"><summary>Show monthly amounts</summary><div class="tbl-scroll"><table><thead><tr><th>Month</th><th>Came in</th><th>Spent</th><th>Kept</th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
  }
  /* Budgets for a month, each with markers at 50% and 80%. */
  function budgetRows(m) {
    const rows = budgetStatus(m);
    if (!rows.length) return `<p class="hint">No budgets yet. Set a limit for the month or for single categories and you'll see how you're doing here.</p>`;
    const prevName = fMonthName(addMonths(m, -1));
    return `<div class="brows">${rows.map((b) => {
      const left = round2(b.total - b.spent), pct = Math.max(0, Math.min(100, b.pct));
      const tone = b.level >= 100 ? "bad" : b.level >= 80 ? "warn" : "";
      return `<div class="brow"><div class="brow-top"><span class="brow-name">${b.color ? `<i style="background:${b.color}"></i>` : ""}${esc(b.name === "Monthly budget" ? "Whole month" : b.name)}</span><span class="brow-val"><b>${esc(W(b.spent))}</b> of ${esc(W(b.total))}</span></div>
        <span class="meter marks ${tone}" role="img" aria-label="${Math.round(b.pct)}% used"><i style="width:${pct}%"></i></span>
        <span class="brow-note ${tone}">${left < 0 ? `Over by ${esc(W(-left))}` : `${esc(W(left))} left`}${b.carry ? ` · includes ${esc(W(b.carry))} carried over from ${esc(prevName)}` : ""}</span></div>`;
    }).join("")}</div>`;
  }
  function hbarList(items, total, nameOf, colorOf, act) {
    const max = items[0]?.total || 1;
    return `<div class="hbars">${items.map((x) => {
      const pct = total > 0 ? (x.total / total) * 100 : 0;
      return `<button type="button" class="hbar" ${act(x)} data-tip="${esc(`${nameOf(x)} · ${plural(x.count, "expense")}`)}"><span class="hbar-name"><i style="background:${colorOf(x)}"></i>${esc(nameOf(x))}</span><span class="hbar-track"><span class="hbar-fill" style="width:${(x.total / max) * 100}%"></span></span><span class="hbar-val">${esc(W(x.total))}<small>${pct > 0 && pct < 1 ? "<1" : Math.round(pct)}%</small></span></button>`;
    }).join("")}</div>`;
  }

  /* ---------- insights: a report for a week, a month or a year ---------- */
  function renderInsights() {
    const p = ui.insPeriod, t = todayISO(), r = periodRange(p, ui.anchor), isCur = inPeriod(p, ui.anchor);
    const m = monthOf(ui.anchor);
    const list = entriesBetween(r.from, r.to);
    const { spent, income, net } = totals(list);
    const span = daysBetween(r.from, r.to) + 1;
    const elapsed = isCur ? daysBetween(r.from, t) + 1 : r.to < t ? span : 0;
    const pr = periodRange(p, stepAnchor(p, ui.anchor, -1));
    const prev = totals(entriesBetween(pr.from, isCur ? addDays(pr.from, elapsed - 1) : pr.to)).spent;
    const change = prev > 0 ? (spent - prev) / prev : null;
    const prevName = p === "week" ? (isCur ? "last week" : "the week before") : p === "year" ? pr.from.slice(0, 4) : fMonthName(monthOf(pr.from));
    const cats = catTotals(list), methods = methodTotals(list);
    const B = budgetFor(m);
    const nIncome = list.filter((e) => e.type === "income").length;
    const changeText = change === null ? "Nothing to compare" : `${change > 0 ? "▲" : change < 0 ? "▼" : ""} ${Math.abs(Math.round(change * 100))}%`;

    // The spending chart: days for a week or a month, months for a year
    let chart;
    if (p === "year") {
      const months = Array.from({ length: 12 }, (_, i) => `${r.from.slice(0, 4)}-${pad(i + 1)}`);
      const vals = months.map((mm) => Math.max(0, totals(entriesIn(mm)).spent));
      const peak = vals.reduce((bi, v, i) => (v > vals[bi] ? i : bi), 0);
      chart = { title: "Month by month", sub: `What you spent each month in ${r.from.slice(0, 4)}.${state.settings.budget > 0 ? " The dashed line is your monthly budget." : ""}`, html: vchart({
        values: vals, labels: months.map(fMon), tips: months.map((mm, i) => `${fMonth(mm)} · ${money(vals[i])}`), showLabel: () => true,
        ref: state.settings.budget || 0, refLabel: "", aria: `Spending each month in ${r.from.slice(0, 4)}. The highest was ${fMonth(months[peak])} at ${money(vals[peak])}.`,
      }), rows: months.map((mm, i) => [fMonth(mm), vals[i]]) };
    } else {
      const dates = Array.from({ length: span }, (_, i) => addDays(r.from, i));
      const byDay = new Map(dates.map((d) => [d, 0]));
      for (const e of list) byDay.set(e.date, (byDay.get(e.date) || 0) + spendOf(e));
      const vals = dates.map((d) => Math.max(0, round2(byDay.get(d))));
      const peak = vals.reduce((bi, v, i) => (v > vals[bi] ? i : bi), 0);
      const daily = B.total > 0 ? B.total / daysInMonth(m) : 0;
      chart = { title: "Day by day", sub: `What you spent each day${p === "week" ? " this week" : ` in ${fMonthName(m)}`}.${daily ? " The dashed line is your budget split evenly across the month." : ""}`, html: vchart({
        values: vals, labels: dates.map((d) => (p === "week" ? DF.wd.format(parseISO(d)) : String(Number(d.slice(8))))),
        tips: dates.map((d, i) => `${fDay(d)} · ${money(vals[i])}`), showLabel: (i) => p === "week" || i === 0 || (i + 1) % 5 === 0,
        ref: daily, refLabel: daily ? `Even share ${W(daily)} a day` : "", aria: `Daily spending for ${periodLabel(p, ui.anchor)}. The highest day was ${fDate(dates[peak])} at ${money(vals[peak])}.`,
      }), rows: dates.filter((d, i) => vals[i] > 0).map((d) => [fDay(d), Math.max(0, round2(byDay.get(d)))]) };
    }
    const flowMonths = p === "year" ? Array.from({ length: 12 }, (_, i) => `${r.from.slice(0, 4)}-${pad(i + 1)}`) : Array.from({ length: 6 }, (_, i) => addMonths(m, i - 5));
    const flowTotals = flowMonths.map((mm) => totals(entriesIn(mm)));

    let body;
    if (!list.length) {
      body = `<div class="empty"><h3>Nothing to chart for ${esc(periodLabel(p, ui.anchor))}</h3><p>Once you add entries for this ${PERIOD_WORD[p]}, you'll see your spending by day and category, budgets, payment methods and how it compares with before.</p><button type="button" class="btn primary" data-act="add-entry">${svg("plus")}Add entry</button></div>`;
    } else {
      const catBars = cats.length ? hbarList(cats, spent, (x) => catById(x.id).name, (x) => catById(x.id).color, (x) => `data-act="go-cat" data-cat="${esc(x.id)}"`) : `<p class="hint">No spending logged.</p>`;
      const methodBars = methods.length ? hbarList(methods, spent, (x) => METHODS[x.id] || "Other", (x) => METHOD_COLORS[x.id] || "#52525B", (x) => `data-act="go-method" data-k="${esc(x.id)}"`) : `<p class="hint">No spending logged.</p>`;
      body = `<div class="insights">
        <section class="card span2"><div class="card-head"><h3>${chart.title}</h3><p>${esc(chart.sub)}</p></div>${chart.html}
          <details class="tbl"><summary>Show the amounts</summary><div class="tbl-scroll"><table><thead><tr><th>${p === "year" ? "Month" : "Day"}</th><th>Spent</th></tr></thead><tbody>${chart.rows.map(([l, v]) => `<tr><td>${esc(l)}</td><td>${esc(money(v))}</td></tr>`).join("")}</tbody></table></div></details></section>
        <section class="card"><div class="card-head"><h3>By category</h3><p>Tap a category to see its entries.</p></div>${catBars}</section>
        <section class="card"><div class="card-head split"><div><h3>Budgets</h3><p>${p === "month" ? `How ${esc(fMonthName(m))} compares with the limits you set.` : `Budgets are monthly. This is ${esc(fMonthName(m))}.`}</p></div><button type="button" class="btn small" data-act="budgets">Edit budgets</button></div>${budgetRows(m)}</section>
        <section class="card"><div class="card-head"><h3>By payment method</h3><p>How you paid: UPI, cards, cash and the rest.</p></div>${methodBars}</section>
        <section class="card"><div class="card-head"><h3>In and out</h3><p>What came in and what you spent ${p === "year" ? `each month of ${esc(r.from.slice(0, 4))}` : `over six months, ending with ${esc(fMonthName(m))}`}.</p></div>${flowChart(flowMonths, flowTotals)}</section>
      </div>`;
    }
    const seg = (k, l) => `<button type="button" data-act="ins-period" data-k="${k}" aria-pressed="${p === k}">${l}</button>`;
    $("#view-insights").innerHTML = `<div class="wrap view-body">
      <header class="view-head"><div><p class="eyebrow">Insights</p><h1 class="large-title">${esc(periodLabel(p, ui.anchor))}</h1></div>
        <div class="head-tools"><button type="button" class="btn" data-act="export-menu" aria-haspopup="menu">${svg("download")}Export</button><div class="seg" role="group" aria-label="Report period">${seg("week", "Week")}${seg("month", "Month")}${seg("year", "Year")}</div>${periodNav(p)}</div></header>
      <div class="kpis">
        ${kpi("Spent", W(Math.max(0, spent)), elapsed ? `${W(Math.max(0, spent) / elapsed)} a day on average` : `This ${PERIOD_WORD[p]} hasn't started`)}
        ${kpi("Came in", W(income), nIncome ? plural(nIncome, "income entry", "income entries") : "No income logged")}
        ${income > 0 ? kpi(net >= 0 ? "Kept" : "Short by", W(Math.abs(net)), net >= 0 ? `A savings rate of ${Math.round((net / income) * 100)}%` : "You spent more than came in", net >= 0 ? "good" : "bad") : kpi("Kept", "None yet", "Add income to see your savings rate")}
        ${kpi(`Spending against ${prevName}`, changeText, change === null ? `Nothing logged for ${prevName}` : isCur ? `${W(prev)} at the same point` : `${W(prev)} in ${prevName}`, change === null ? "" : change > 0.05 ? "warn" : change < -0.05 ? "good" : "")}
      </div><div class="insights smart">${smartSection(p)}</div>${body}</div>`;
  }

  /* ================= smart features on screen ================= */
  const TONE = { bad: ["alert", "Needs attention"], warn: ["bell", "Heads up"], info: ["spark", "Worth knowing"], good: ["check", "Good news"] };
  Object.assign(ICONS, { spark: '<path d="M12 3.5 13.8 9l5.7 1.8-5.7 1.9L12 18.5l-1.8-5.8L4.5 10.8 10.2 9z"/>', heart: '<path d="M20.4 8.7c0 5-8.4 10.8-8.4 10.8S3.6 13.7 3.6 8.7A4.4 4.4 0 0 1 12 6.6a4.4 4.4 0 0 1 8.4 2.1z"/>' });

  function insightCard(x) {
    const [icon, label] = TONE[x.tone];
    const tag = x.act ? "button" : "div";
    return `<${tag}${x.act ? ` type="button" ${x.act}` : ""} class="insight t-${x.tone}">
      <span class="insight-tag">${svg(icon)}${label}</span>

    const e = state.entries.find((x) => x.id === id); if (!e) return;
    withUndo(() => {
      state.entries = state.entries.filter((x) => x.id !== id);
      for (const r of state.recurring) for (const [k, v] of Object.entries(r.paid)) if (v === id) delete r.paid[k];
    }, `${entryTitle(e)} deleted`);
  }

  /* ---------- recurring ---------- */
  function recurringForm(item = null) {
    const d = item
      ? { kind: item.kind, name: item.name, amount: String(item.amount), category: item.category, frequency: item.frequency, start: item.start, end: item.end, variable: item.variable, auto: item.auto, account: item.account, to: item.to, note: item.note, active: item.active !== false, method: item.method }
      : { kind: "expense", name: "", amount: "", category: "", frequency: "monthly", start: todayISO(), end: "", variable: false, auto: false, account: "", to: "", note: "", active: true, method: "" };
    const pool = () => state.accounts.filter((a) => !a.archived || a.id === d.account || a.id === d.to);
    const fix = () => {
      const list = pool();
      if (!list.some((a) => a.id === d.account)) d.account = (list.find((a) => a.type === "bank") || list.find((a) => a.type !== "goal") || list[0] || {}).id || "";
      if (d.kind !== "transfer" && !state.categories.some((c) => c.id === d.category && c.kind === d.kind)) {
        d.category = (state.categories.find((c) => c.id === (d.kind === "income" ? "salary" : "bills") && c.kind === d.kind) || state.categories.find((c) => c.kind === d.kind)).id;
      }
      if (d.kind === "transfer" && (d.to === d.account || !list.some((a) => a.id === d.to))) d.to = (list.find((a) => a.id !== d.account && a.type === "goal") || list.find((a) => a.id !== d.account) || {}).id || "";
    };
    const read = () => {
      const get = (id, key) => { const el = document.getElementById(id); if (el) d[key] = el.type === "checkbox" ? el.checked : el.value; };
      get("r-name", "name"); get("r-amount", "amount"); get("r-category", "category"); get("r-frequency", "frequency"); get("r-start", "start"); get("r-end", "end");
      get("r-account", "account"); get("r-method", "method"); get("r-to", "to"); get("r-variable", "variable"); get("r-auto", "auto"); get("r-note", "note"); get("r-active", "active");
    };
    const TEXT = {
      expense: { eg: "e.g. Rent", acct: "Usually paid from", auto: "Add it by itself on the due date, like a subscription that charges your card" },
      income: { eg: "e.g. Salary", acct: "Usually received in", auto: "Add it by itself on the day it arrives" },
      transfer: { eg: "e.g. Holiday savings", acct: "From", auto: "Move it by itself on the due date, like a standing order" },
    };
    const body = () => {
      const X = TEXT[d.kind], list = acctOptions(pool());
      return `
        <div class="field"><div class="seg" role="group" aria-label="Kind of recurring item">${Object.entries(RKIND).map(([k, x]) => `<button type="button" data-act="sheet" data-k="${k}" aria-pressed="${d.kind === k}">${x.label}</button>`).join("")}</div></div>
        <label class="field"><span class="lab">Name</span><input class="input" id="r-name" maxlength="60" placeholder="${X.eg}" value="${esc(d.name)}" autocomplete="off"${item ? "" : " autofocus"} aria-describedby="e-name"><span class="err" id="e-name" hidden></span></label>
        <div class="grid2">
          <label class="field"><span class="lab">Amount</span><input class="input" id="r-amount" inputmode="decimal" placeholder="0" value="${esc(d.amount)}" autocomplete="off" aria-describedby="e-ramount"><span class="err" id="e-ramount" hidden></span></label>
          <label class="field"><span class="lab">How often</span>${select("r-frequency", Object.entries(FREQ).map(([k, f]) => [k, f.label]), d.frequency)}</label>
          <label class="field"><span class="lab">First due on</span><input class="input" type="date" id="r-start" value="${esc(d.start)}" aria-describedby="e-start h-start"><span class="hint" id="h-start">Later dates follow from this one.</span><span class="err" id="e-start" hidden></span></label>
          <label class="field"><span class="lab">Ends on <span class="opt-lab">(optional)</span></span><input class="input" type="date" id="r-end" value="${esc(d.end)}" aria-describedby="e-end h-end"><span class="hint" id="h-end">For loans and instalments.</span><span class="err" id="e-end" hidden></span></label>
          ${d.kind === "transfer" ? "" : `<label class="field"><span class="lab">Category</span>${select("r-category", state.categories.filter((c) => c.kind === d.kind).map((c) => [c.id, c.name]), d.category)}</label>`}
          <label class="field"><span class="lab">${X.acct}</span>${select("r-account", list, d.account)}</label>
          ${d.kind === "transfer" ? "" : `<label class="field"><span class="lab">${d.kind === "income" ? "Received by" : "Paid with"}</span>${select("r-method", methodChoices(), METHODS[d.method] ? d.method : methodFor(acctById(d.account)?.type, state.settings.currency))}</label>`}
          ${d.kind === "transfer" ? `<label class="field"><span class="lab">To</span>${select("r-to", list, d.to, ' aria-describedby="e-rto"')}<span class="err" id="e-rto" hidden></span></label>` : ""}
        </div>
        <label class="check"><input type="checkbox" id="r-variable"${d.variable ? " checked" : ""}><span>The amount changes each time, like an electricity bill</span></label>
        <label class="check"><input type="checkbox" id="r-auto"${d.auto ? " checked" : ""}><span>${X.auto}</span></label>
        <label class="field"><span class="lab">Note <span class="opt-lab">(optional)</span></span><input class="input" id="r-note" maxlength="140" value="${esc(d.note)}" autocomplete="off"></label>
        ${item ? `<label class="check"><input type="checkbox" id="r-active"${d.active ? " checked" : ""}><span>Active (untick to pause reminders)</span></label>` : ""}`;
    };
    fix();
    openSheet({
      title: item ? `Edit ${item.name}` : "Add recurring",
      body: body(),
      foot: item ? FOOT_EDIT() : FOOT_ADD("Add recurring"),
      onAct(k) {
        if (!RKIND[k]) return;
        read(); d.kind = k; fix();
        $("#sheet-body").innerHTML = body();
        $(`#sheet-body [data-k="${k}"]`)?.focus();
      },
      onSubmit() {
        read();
        const name = d.name.trim(), amount = parseAmount(d.amount);
        const endOk = !d.end || (isDate(d.end) && isDate(d.start) && d.end >= d.start);
        const toOk = d.kind !== "transfer" || (d.to && d.to !== d.account);
        showErr("e-name", name ? "" : "Give it a name, like Rent.");
        showErr("e-ramount", amount > 0 ? "" : "Enter an amount above zero.");
        showErr("e-start", isDate(d.start) ? "" : "Choose the first due date.");
        showErr("e-end", endOk ? "" : "The end date has to be on or after the first due date.");
        showErr("e-rto", toOk ? "" : state.accounts.length < 2 ? "Add a second account in Wallet first." : "Choose a different account to move the money into.");
        if (!name) return stop("r-name");
        if (!(amount > 0)) return stop("r-amount");
        if (!isDate(d.start)) return stop("r-start");
        if (!endOk) return stop("r-end");
        if (!toOk) return stop("r-to");
        const data = {
          kind: d.kind, name, amount, category: d.kind === "transfer" ? "" : d.category, frequency: FREQ[d.frequency] ? d.frequency : "monthly",
          start: d.start, day: item && item.start === d.start ? item.day : Number(d.start.slice(8)), end: d.end || "",
          variable: !!d.variable, auto: !!d.auto, account: d.account, to: d.kind === "transfer" ? d.to : "", note: d.note.trim(),
          method: d.kind === "transfer" ? "" : METHODS[d.method] ? d.method : methodFor(acctById(d.account)?.type, state.settings.currency),
        };
        if (item) {
          const r = state.recurring.find((x) => x.id === item.id);
          if (r) Object.assign(r, data, { active: !!d.active });
          commit(); toast("Saved");
        } else {
          state.recurring.push({ id: uid(), ...data, active: true, paid: {} });
          commit(); toast(`${name} added`);
        }
        runAuto();
      },
      onDelete: item ? () => { closeSheet(); deleteRecurring(item.id); } : null,
    });
  }
  function deleteRecurring(id) {
    const r = state.recurring.find((x) => x.id === id); if (!r) return;
    withUndo(() => { state.recurring = state.recurring.filter((x) => x.id !== id); }, `${r.name} deleted. Its past entries stay in your activity`);
  }
  function toggleRecurring(id) {
    const r = state.recurring.find((x) => x.id === id); if (!r) return;
    r.active = r.active === false;
    commit();
    toast(`${r.name} ${r.active ? "resumed" : "paused"}`);
  }
  function payForm(r) {
    const st = cycleStatus(r, todayISO());
    if (!st) return;
    const K = RKIND[r.kind], monthly = !FREQ[r.frequency].days;
    const pool = state.accounts.filter((a) => !a.archived || a.id === r.account);
    openSheet({
      title: `${K.action} ${r.name}`,
      body: `<p class="sheet-intro">${monthly ? `For ${esc(fMonth(st.key))}, due` : "Due"} ${esc(fDateLong(st.due))}.${r.kind === "transfer" ? ` Moves into ${esc(acctName(r.to))}.` : ""}${r.variable ? " This amount varies, so check it matches." : ""}</p>
        <div class="field"><label class="amount-field" for="p-amount"><span class="sym">${esc(curSymbol())}</span><input id="p-amount" inputmode="decimal" autocomplete="off" value="${esc(String(r.amount))}" aria-label="Amount" aria-describedby="e-pamount"></label><p class="err" id="e-pamount" hidden></p></div>
        <div class="grid2">
          <label class="field"><span class="lab">${r.kind === "income" ? "Received on" : r.kind === "transfer" ? "Moved on" : "Paid on"}</span><input class="input" type="date" id="p-date" value="${esc(todayISO())}"></label>
          <label class="field"><span class="lab">${r.kind === "income" ? "Received in" : r.kind === "transfer" ? "From" : "Paid from"}</span>${select("p-account", acctOptions(pool.filter((a) => a.id !== r.to)), r.account)}</label>
        </div>`,
      foot: `<button type="button" class="btn" data-act="sheet" data-k="skip">${svg("skip")}Skip this one</button><span class="spacer"></span><button type="button" class="btn" data-sheet-close>Cancel</button><button type="submit" class="btn primary">${svg("check")}Mark ${K.done}</button>`,
      onAct(k) {
        if (k !== "skip") return;
        closeSheet();
        withUndo(() => { const rr = state.recurring.find((x) => x.id === r.id); if (rr) rr.paid[st.key] = "skipped"; }, `Skipped ${r.name} for ${monthly ? fMonth(st.key) : fDate(st.due)}`);
      },
      onSubmit() {
        const amount = parseAmount(val("p-amount"));
        showErr("e-pamount", amount > 0 ? "" : "Enter an amount above zero.");
        if (!(amount > 0)) return stop("p-amount");
        const date = isDate(val("p-date")) ? val("p-date") : todayISO();
        const account = val("p-account") || r.account;
        withUndo(() => {
          const id = uid();
          state.entries.push(entryFromRecurring(r, id, date, amount, account));
          const rr = state.recurring.find((x) => x.id === r.id);
          if (rr) rr.paid[st.key] = id;
        }, `${r.name} ${K.done} and added to your activity`);
      },
    });
  }
  function historySheet(r) {
    const entries = state.entries.filter((e) => e.recurringId === r.id).sort(byNewest);
    openSheet({
      title: `${r.name}: history`,
      body: entries.length
        ? `<div class="lines">${entries.map((e) => `<div class="line"><span>${esc(fDateLong(e.date))} · ${esc(acctName(e.account))}</span><span class="v">${esc(money(e.amount))}</span></div>`).join("")}<div class="line total"><span>Total</span><span class="v">${esc(money(sum(entries.map((e) => e.amount))))}</span></div></div>`
        : `<p class="sheet-intro">Nothing recorded yet. Each time you mark this ${RKIND[r.kind].done}, it shows up here.</p>`,
      foot: `<button type="button" class="btn primary" data-sheet-close>Done</button>`,
    });
  }

  /* ---------- accounts and goals ---------- */
  function accountForm(item = null, goal = false) {
    const isGoal = item ? item.type === "goal" : goal;
    const bal = item ? balances().get(item.id) || 0 : 0;
    const used = item ? state.entries.filter((e) => e.account === item.id || e.to === item.id).length : 0;
    const usedRec = item ? state.recurring.filter((r) => r.account === item.id || r.to === item.id).length : 0;
    const v = item || { name: "", type: isGoal ? "goal" : "bank", opening: 0, target: 0, deadline: "", archived: false };
    const keep = used + usedRec > 0;
    openSheet({
      title: item ? `Edit ${item.name}` : isGoal ? "Add goal" : "Add account",
      body: `
        ${item ? `<p class="sheet-intro">${isGoal ? "Saved so far" : "Balance now"}: <b>${esc(balText(item, bal))}</b> · ${plural(used, "entry", "entries")}${used ? ` · <button type="button" class="linkish" data-act="acct-activity" data-id="${esc(item.id)}">See its activity</button>` : ""}</p>` : ""}
        <label class="field"><span class="lab">Name</span><input class="input" id="a-name" maxlength="32" placeholder="${isGoal ? "e.g. New laptop" : "e.g. Main account"}" value="${esc(v.name)}" autocomplete="off"${item ? "" : " autofocus"} aria-describedby="e-aname"><span class="err" id="e-aname" hidden></span></label>
        <div class="grid2">
          ${isGoal
            ? `<label class="field"><span class="lab">Target</span><input class="input" id="a-target" inputmode="decimal" placeholder="0" value="${v.target ? esc(String(v.target)) : ""}" autocomplete="off" aria-describedby="e-atarget"><span class="err" id="e-atarget" hidden></span></label>
               <label class="field"><span class="lab">Target date <span class="opt-lab">(optional)</span></span><input class="input" type="date" id="a-deadline" value="${esc(v.deadline)}"></label>`
            : `<label class="field"><span class="lab">Type</span>${select("a-type", Object.entries(ACCT).filter(([k]) => k !== "goal").map(([k, a]) => [k, a.label]), v.type)}</label>`}
          <label class="field"><span class="lab">${isGoal ? "Already saved" : "Starting balance"}</span><input class="input" id="a-opening" inputmode="decimal" placeholder="0" value="${v.opening ? esc(String(v.opening)) : ""}" autocomplete="off" aria-describedby="h-opening"><span class="hint" id="h-opening">${isGoal ? "What you had put aside before tracking it here." : "What it held before your first entry here. For money you owe on a card, enter it with a minus sign."}</span></label>
        </div>
        ${item && keep ? `<p class="hint">${v.archived ? "This account is archived." : "This one has history, so it can be archived but not deleted."} Archived accounts are hidden from pickers and still count in your totals.</p>` : ""}`,
      foot: item ? FOOT_EDIT(keep ? `${svg("archive")}${v.archived ? "Restore" : "Archive"}` : `${svg("trash")}Delete`) : FOOT_ADD(isGoal ? "Add goal" : "Add account"),
      onSubmit() {
        const name = val("a-name"), target = isGoal ? parseAmount(val("a-target")) : 0;
        showErr("e-aname", name ? "" : "Give it a name.");
        showErr("e-atarget", !isGoal || target > 0 ? "" : "Enter the amount you're aiming for.");
        if (!name) return stop("a-name");
        if (isGoal && !(target > 0)) return stop("a-target");
        const data = { name: name.slice(0, 32), type: isGoal ? "goal" : ACCT[val("a-type")] ? val("a-type") : "bank", opening: parseSigned(val("a-opening")), target, deadline: isGoal && isDate(val("a-deadline")) ? val("a-deadline") : "" };
        if (item) {
          const a = state.accounts.find((x) => x.id === item.id);
          if (a) Object.assign(a, data);
          commit(); toast("Saved");
        } else {
          const nGoals = state.accounts.filter((a) => a.type === "goal").length;
          state.accounts.push(newAccount((isGoal ? "g" : "a") + uid(), data.name, data.type, data.opening, { target, deadline: data.deadline, color: isGoal ? GOAL_COLORS[nGoals % GOAL_COLORS.length] : "" }));
          commit(); toast(`${data.name} added`);
        }
      },
      onDelete: item ? () => {
        closeSheet();
        if (keep) {
          const a = state.accounts.find((x) => x.id === item.id); if (!a) return;
          a.archived = !a.archived;
          commit(); toast(`${a.name} ${a.archived ? "archived" : "restored"}`);
        } else {
          withUndo(() => { state.accounts = state.accounts.filter((x) => x.id !== item.id); }, `${item.name} deleted`);
        }
      } : null,
    });
  }

  /* ---------- budgets ---------- */

    openSheet({
      title: "Budgets",
      body: `<p class="sheet-intro">Set a limit for the whole month, for single categories, or both. Leave a box empty for no limit.</p>

          <label class="check"><input type="checkbox" id="b-carry"${state.settings.carry ? " checked" : ""}><span>Carry unused budget into the next month<small>Only last month's leftover is added, so it doesn't pile up.</small></span></label>
