    const account = acctById(opts.account);
    const cash = state.accounts.find((a) => a.type === "cash" && !a.archived && a.id !== opts.account);
    const byName = (n) => state.accounts.find((a) => a.name.toLowerCase() === String(n || "").trim().toLowerCase());
    const typeByLabel = Object.fromEntries(Object.entries(TYPES).map(([k, t]) => [t.label.toLowerCase(), k]));
    const methodByLabel = Object.fromEntries(Object.entries(METHODS).map(([k, l]) => [l.toLowerCase(), k]));
    // Existing entries that a row could duplicate, counted so two real coffees on one day both stay
    const existing = new Map();
    for (const e of state.entries) { const k = `${e.date}|${e.amount}|${e.account}|${isIn(e) ? "in" : "out"}`; existing.set(k, (existing.get(k) || 0) + 1); }
    const out = [];
    for (const r of rows) {
      const raw = spentFile ? spentCol(r, "description") : col(r, "desc");
      const date = parseDateCell(col(r, "date"), opts.order);
      if (!date) { out.push({ status: "bad", why: "No date we could read", raw: r.join(" · ").slice(0, 80) }); continue; }
      let type, amount;
      if (spentFile) {
        type = typeByLabel[String(spentCol(r, "type")).toLowerCase()] || "expense";
        amount = Math.abs(parseMoneyCell(spentCol(r, "amount")) || 0);
      } else if (map.debit !== undefined || map.credit !== undefined) {
        const dr = Math.abs(parseMoneyCell(col(r, "debit")) || 0), cr = Math.abs(parseMoneyCell(col(r, "credit")) || 0);
        if (dr > 0) { type = "expense"; amount = dr; } else if (cr > 0) { type = "income"; amount = cr; }
      } else {
        const n = parseMoneyCell(col(r, "amount"));
        if (n) {
          amount = Math.abs(n);
          const t = String(col(r, "type")).trim();
          if (t) type = /^(dr|d|debit|withdrawal|out|expense|paid)/i.test(t) ? "expense" : "income";
          else type = (n < 0) === (opts.negative === "out") ? "expense" : "income";
        }
      }
      if (!(amount > 0)) { out.push({ status: "bad", why: "No amount", raw: r.join(" · ").slice(0, 80) }); continue; }
      let acct = account, to = "";
      if (spentFile) { acct = byName(spentCol(r, "account")) || account; const t = byName(spentCol(r, "to account")); if (type === "transfer") to = t && t.id !== acct.id ? t.id : ""; }
      if (type === "transfer" && !to) type = "expense";
      if (!spentFile && type === "expense" && opts.atm && cash && isAtm(raw)) { type = "transfer"; to = cash.id; }
      if (!spentFile && type === "income" && isReversal(raw)) type = "refund";
      const title = spentFile ? String(raw).slice(0, 80) : cleanNarration(raw);
      const kind = TYPES[type].cat;
      let category = "";
      if (kind) {
        const named = String(spentFile ? spentCol(r, "category") : col(r, "category")).trim().toLowerCase();
        const byCat = named && state.categories.find((c) => c.kind === kind && c.name.toLowerCase() === named);
        category = byCat ? byCat.id : (guessCategory(title, kind) || guessCategory(raw, kind) || { id: kind === "income" ? "other-in" : "other" }).id;
      }
      const method = type === "transfer" ? "" : spentFile ? methodByLabel[String(spentCol(r, "method")).toLowerCase()] || methodFor(acct.type, state.settings.currency) : methodFromText(raw, acct.type, type);
      const person = TYPES[type].person ? String(spentCol(r, "person")).trim().slice(0, 40) || "Someone" : "";
      const noteBits = [spentFile ? spentCol(r, "note") : col(r, "note"), !spentFile && title !== String(raw).trim() ? String(raw).trim() : ""].filter(Boolean);
      const e = {
        id: uid(), type, title: title === "Imported entry" ? "" : title, amount, category, date, account: acct.id, to, person, note: noteBits.join(" · ").slice(0, 140),
        recurringId: null, method, due: spentFile && isDate(spentCol(r, "pay back by")) ? spentCol(r, "pay back by") : "",
        ...(spentFile ? foreign({ cur: spentCol(r, "original currency"), orig: parseMoneyCell(spentCol(r, "original amount")), rate: parseRate(spentCol(r, "rate")) }, state.settings.currency) : { cur: "", orig: 0, rate: 0 }),
      };
      const key = `${e.date}|${e.amount}|${e.account}|${isIn(e) ? "in" : "out"}`;
      if (opts.skipDupes && existing.get(key) > 0) { existing.set(key, existing.get(key) - 1); out.push({ status: "dupe", e }); continue; }
      out.push({ status: "new", e });
    }
    return out;
  }

  /* ---------- the import sheet ---------- */
  function importSheet() {
    const live = state.accounts.filter((a) => !a.archived);
    const imp = { name: "", rows: [], header: [], map: {}, opts: { account: (live.find((a) => a.type === "bank") || live[0] || {}).id || "", order: "dmy", negative: "out", skipDupes: true, atm: true } };
    let result = [];
    const pickStep = (msg = "") => `
      <p class="sheet-intro">Bring in transactions from your bank's CSV or Excel download, or from a CSV exported from Spent. Most banks offer one under statements or account history.</p>
      <div class="import-drop">
        <label class="btn primary">${svg("upload")}Choose a file<input type="file" id="imp-file" class="sr" accept=".csv,.txt,.tsv,.xlsx,.xls,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label>
        <span class="hint">CSV, TXT, XLSX or XLS</span>
      </div>
      <label class="field"><span class="lab">Or paste the rows here</span><textarea class="copybox" id="imp-paste" placeholder="Date,Description,Amount&#10;12/11/2026,Swiggy,-420"></textarea></label>
      <p class="err" id="imp-err"${msg ? "" : " hidden"}>${esc(msg)}</p>
      <p class="hint">Your file is read on this device only and never uploaded. Spent never asks for bank logins, UPI PINs or passwords.</p>`;
    const colOptions = () => [["", "Not in this file"], ...imp.header.map((h, i) => [String(i), `${h || `Column ${i + 1}`}${imp.rows[0]?.[i] ? ` (e.g. ${String(imp.rows[0][i]).slice(0, 24)})` : ""}`])];
    const mapStep = () => {
      result = buildImport(imp);
      const n = { new: 0, dupe: 0, bad: 0 }; for (const x of result) n[x.status]++;
      const spentFile = isSpentExport(imp.header);
      const preview = result.slice(0, 8).map((x) => x.e
        ? `<tr class="${x.status}"><td>${esc(fDate(x.e.date))}</td><td>${esc(entryTitle(x.e))}</td><td>${esc(x.e.category ? catById(x.e.category, TYPES[x.e.type].cat).name : TYPES[x.e.type].label)}</td><td class="${isIn(x.e) ? "in" : ""}">${isIn(x.e) ? "+" : ""}${esc(money(x.e.amount))}</td><td>${x.status === "dupe" ? "Already here" : "New"}</td></tr>`
        : `<tr class="bad"><td colspan="4">${esc(x.raw)}</td><td>${esc(x.why)}</td></tr>`).join("");
      return `
        <p class="sheet-intro"><b>${esc(imp.name)}</b>: ${plural(imp.rows.length, "row")}. ${spentFile ? "This is a Spent export, so its types, accounts and methods come across as they are." : "Check the columns below. They're matched from the file's headings."}</p>
        ${spentFile ? "" : `<div class="grid2">${FIELDS.map(([k, label, req]) => `<label class="field"><span class="lab">${label}${req ? "" : ' <span class="opt-lab">(if there is one)</span>'}</span>${select("imp-" + k, colOptions(), imp.map[k] === undefined ? "" : String(imp.map[k]), ` data-map="${k}"`)}</label>`).join("")}</div>`}
        <div class="grid2">
          <label class="field"><span class="lab">${spentFile ? "Account for rows without one" : "Import into"}</span>${select("imp-account", acctOptions(live), imp.opts.account)}</label>
          <label class="field"><span class="lab">Dates are written</span>${select("imp-order", [["dmy", "Day first (31/12/2026)"], ["mdy", "Month first (12/31/2026)"]], imp.opts.order)}</label>
          ${!spentFile && imp.map.amount !== undefined && imp.map.debit === undefined && imp.map.type === undefined ? `<label class="field"><span class="lab">A minus sign means</span>${select("imp-negative", [["out", "Money out"], ["in", "Money in"]], imp.opts.negative)}</label>` : ""}
        </div>
        <label class="check"><input type="checkbox" id="imp-dupes"${imp.opts.skipDupes ? " checked" : ""}><span>Skip rows that are already in Spent<small>Same date, amount and account as an existing entry.</small></span></label>
        ${spentFile ? "" : `<label class="check"><input type="checkbox" id="imp-atm"${imp.opts.atm ? " checked" : ""}><span>Treat ATM withdrawals as moving money into Cash<small>So they don't count as spending.</small></span></label>`}
        <div class="imp-sum"><span><b>${n.new}</b> to import</span>${n.dupe ? `<span><b>${n.dupe}</b> already here</span>` : ""}${n.bad ? `<span class="warn"><b>${n.bad}</b> couldn't be read</span>` : ""}</div>
        <div class="tbl-scroll imp-preview"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th>Status</th></tr></thead><tbody>${preview}</tbody></table></div>
        ${result.length > 8 ? `<p class="hint">Showing the first 8 of ${plural(result.length, "row")}. Categories are picked from your past entries and common words; you can change any of them afterwards.</p>` : ""}`;
    };
    const step = (which, msg) => {
      $("#sheet-body").innerHTML = which === "pick" ? pickStep(msg) : mapStep();
      const n = result.filter((x) => x.status === "new").length;
      $("#sheet-foot").hidden = false;
      $("#sheet-foot").innerHTML = which === "pick"
        ? `<button type="button" class="btn" data-sheet-close>Cancel</button><button type="button" class="btn primary" data-act="sheet" data-k="paste">Read pasted rows</button>`
        : `<button type="button" class="btn" data-act="sheet" data-k="back">${svg("left")}Choose another file</button><span class="spacer"></span><button type="submit" class="btn primary"${n ? "" : " disabled"}>Import ${plural(n, "entry", "entries")}</button>`;
    };
    const loadRows = (rows, name) => {
      if (!rows.length) { step("pick", "That file has no rows we could read."); return; }
      if (rows.length > 5001) rows = rows.slice(0, 5001);
      const h = findHeader(rows);
      imp.name = name; imp.header = rows[h].map((c) => String(c)); imp.rows = rows.slice(h + 1).filter((r) => r.length > 1 || r[0]);
      imp.map = guessMap(imp.header);
      imp.opts.order = guessOrder(imp.rows.slice(0, 200).map((r) => r[imp.map.date ?? 0]));
      if (!imp.rows.length) { step("pick", "We found headings but no transactions under them."); return; }
      step("map");
    };
    openSheet({
      title: "Import transactions", body: pickStep(), foot: "",
      onMount(card) {
        step("pick");
        card.addEventListener("change", async (e) => {
          const t = e.target;
          if (t.id === "imp-file") {
            const f = t.files?.[0]; t.value = "";
            if (!f) return;
            if (f.size > 15 * 1024 * 1024) { step("pick", "That file is over 15 MB. Export a shorter date range from your bank."); return; }
            $("#sheet-body").innerHTML = `<div class="loading" role="status"><span class="spinner" aria-hidden="true"></span>Reading ${esc(f.name)}…</div>`;
            try {
              if (/\.xlsx?$/i.test(f.name)) loadRows(await sheetRows(await f.arrayBuffer()), f.name);
              else loadRows(parseDelimited(await f.text()), f.name);
            } catch (err) {
              step("pick", err && /network|timeout|missing/.test(err.message) ? "The spreadsheet reader couldn't load. Check your connection, or save the file as CSV and try again." : "That file couldn't be read. Try saving it as CSV from your bank or spreadsheet app.");
            }
            return;
          }
          if (t.dataset.map) { if (t.value === "") delete imp.map[t.dataset.map]; else imp.map[t.dataset.map] = Number(t.value); step("map"); return; }
          if (t.id === "imp-account") { imp.opts.account = t.value; step("map"); }
          if (t.id === "imp-order") { imp.opts.order = t.value; step("map"); }
          if (t.id === "imp-negative") { imp.opts.negative = t.value; step("map"); }
          if (t.id === "imp-dupes") { imp.opts.skipDupes = t.checked; step("map"); }
          if (t.id === "imp-atm") { imp.opts.atm = t.checked; step("map"); }
        });
      },
      onAct(k) {
        if (k === "back") { step("pick"); return; }
        if (k === "paste") { const text = val("imp-paste"); if (!text) { step("pick", "Paste some rows first, or choose a file."); return; } loadRows(parseDelimited(text), "Pasted rows"); }
      },
      onSubmit() {
        const add = result.filter((x) => x.status === "new").map((x) => x.e);
        if (!add.length) return false;
        withUndo(() => { state.entries.push(...add); }, `${plural(add.length, "entry", "entries")} imported`);
      },
    });
  }

  /* ================= reports: PDF, Excel and CSV for a week, a month or a year ================= */
  function reportData(p, anchor) {
    const r = periodRange(p, anchor), t = todayISO();
    const list = entriesBetween(r.from, r.to).sort((a, b) => (a.date === b.date ? (a.id < b.id ? -1 : 1) : a.date < b.date ? -1 : 1));
    const tt = totals(list), span = daysBetween(r.from, r.to) + 1;
    const elapsed = inPeriod(p, anchor) ? daysBetween(r.from, t) + 1 : r.to < t ? span : 0;
    const pr = periodRange(p, stepAnchor(p, anchor, -1));
    const prev = totals(entriesBetween(pr.from, inPeriod(p, anchor) ? addDays(pr.from, elapsed - 1) : pr.to)).spent;
    let series;
    if (p === "year") series = Array.from({ length: 12 }, (_, i) => { const mm = `${r.from.slice(0, 4)}-${pad(i + 1)}`, x = totals(entriesIn(mm)); return { label: fMon(mm), long: fMonth(mm), spent: Math.max(0, x.spent), income: x.income }; });
    else series = Array.from({ length: span }, (_, i) => { const d = addDays(r.from, i), x = totals(list.filter((e) => e.date === d)); return { label: p === "week" ? DF.wd.format(parseISO(d)) : String(i + 1), long: fDay(d), spent: Math.max(0, x.spent), income: x.income }; });
    const slug = p === "year" ? r.from.slice(0, 4) : p === "week" ? `week-of-${r.from}` : monthOf(anchor);
    return {
      p, r, label: periodLabel(p, anchor), slug, list, ...tt, elapsed, prev, prevName: p === "week" ? "the week before" : p === "year" ? pr.from.slice(0, 4) : fMonthName(monthOf(pr.from)),
      cats: catTotals(list), methods: methodTotals(list), top: list.filter((e) => e.type === "expense").sort((a, b) => b.amount - a.amount).slice(0, 10),
      series, budgets: p === "month" ? budgetStatus(monthOf(anchor)) : [],
    };
  }
  const outOf = (e) => !isIn(e) && e.type !== "transfer";

  /* PDFs use the built-in Helvetica, which has no ₹ sign, so amounts are written with the currency code. */
  const pdfText = (s) => String(s ?? "").replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/[–—−]/g, "-").replace(/…/g, "...").replace(/₹/g, "Rs ").replace(/[^\x20-\x7E\xA0-\xFF]+/g, "?");
  function pdfMoney(n, whole = false) {
    const cur = state.settings.currency, v = Number(n) || 0, dec = whole || ZERO_DEC.includes(cur) ? 0 : 2;
    try { return new Intl.NumberFormat(locFor(cur), { style: "currency", currency: cur, currencyDisplay: "code", minimumFractionDigits: dec, maximumFractionDigits: dec }).format(v); }
    catch { return `${cur} ${v.toFixed(dec)}`; }
  }
  async function exportPDF(p, anchor) {
    const JsPDF = await loadLib("pdf");
    const d = reportData(p, anchor), cur = state.settings.currency;
    const doc = new JsPDF({ unit: "pt", format: "a4" });
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 46, TW = W - 2 * M;
    const INK = [17, 17, 22], GREY = [92, 92, 104], LIGHT = [236, 236, 241], ACC = [200, 16, 46];
    let y = M;
    const T = pdfText;
    const font = (style, size, color = INK) => { doc.setFont("helvetica", style); doc.setFontSize(size); doc.setTextColor(...color); };
    const ensure = (h) => { if (y + h > H - M - 18) { doc.addPage(); y = M; return true; } return false; };
    const fit = (s, w) => { let t = T(s).slice(0, 90); while (t.length > 2 && doc.getTextWidth(t) > w) t = t.slice(0, -4) + "..."; return t; };
    const cell = (s, x, w, al, yy) => { const t = fit(s, w - 12); if (al === "r") doc.text(t, x + w - 6, yy, { align: "right" }); else doc.text(t, x + 6, yy); };
    const heading = (s) => { ensure(70); font("bold", 12.5); doc.text(T(s), M, y + 12); y += 24; };
    function table(title, head, rows, widths, align) {
      if (!rows.length) return;
      heading(title);
      const ws = widths.map((w) => w * TW);
      const drawHead = () => { doc.setFillColor(...LIGHT); doc.rect(M, y, TW, 20, "F"); font("bold", 8, GREY); let x = M; head.forEach((h, i) => { cell(h.toUpperCase(), x, ws[i], align[i], y + 13.5); x += ws[i]; }); y += 20; font("normal", 9.5); };
      drawHead();
      for (const row of rows) {
        if (ensure(18)) drawHead();
        let x = M;
        row.forEach((c, i) => { cell(c, x, ws[i], align[i], y + 12.5); x += ws[i]; });
        doc.setDrawColor(...LIGHT); doc.line(M, y + 18, M + TW, y + 18);
        y += 18;
      }
      y += 16;
    }

    // Title
    font("bold", 22, ACC); doc.text("Spent", M, y + 16);
    font("bold", 17); doc.text(T(`Report for ${d.label}`), M, y + 44);
    font("normal", 9.5, GREY); doc.text(T(`Created ${fDateLong(todayISO())}  ·  Amounts in ${cur}  ·  ${plural(d.list.length, "entry", "entries")}`), M, y + 61);
    y += 80;
    // Summary
    const boxes = [["Spent", pdfMoney(Math.max(0, d.spent))], ["Came in", pdfMoney(d.income)], [d.net >= 0 ? "Kept" : "Short by", pdfMoney(Math.abs(d.net))], ["Savings rate", d.income > 0 ? `${Math.round((d.net / d.income) * 100)}%` : "-"]];
    const bw = (TW - 30) / 4;
    boxes.forEach(([l, v], i) => { const x = M + i * (bw + 10); doc.setFillColor(...LIGHT); doc.roundedRect(x, y, bw, 56, 6, 6, "F"); font("normal", 8, GREY); doc.text(l.toUpperCase(), x + 10, y + 18); font("bold", 12.5); doc.text(fit(v, bw - 20), x + 10, y + 41); });
    y += 70;
    font("normal", 9.5, GREY);
    const notes = [];
    if (d.elapsed && d.spent > 0) notes.push(`${pdfMoney(Math.max(0, d.spent) / d.elapsed, true)} a day on average`);
    if (d.prev > 0) notes.push(`${d.spent >= d.prev ? "up" : "down"} ${Math.abs(Math.round((d.spent / d.prev - 1) * 100))}% on ${d.prevName}${inPeriod(p, anchor) ? " at the same point" : ""}`);
    if (notes.length) { doc.text(T(`Spending: ${notes.join(", ")}.`), M, y + 4); y += 22; }
    // Chart
    const max = Math.max(0, ...d.series.map((s) => s.spent));
    if (max > 0) {
      heading(p === "year" ? "Spending month by month" : "Spending day by day");
      const ch = 110, n = d.series.length, gap = n > 20 ? 2 : 8, bwid = (TW - gap * (n - 1)) / n;
      const peak = d.series.reduce((bi, s, i) => (s.spent > d.series[bi].spent ? i : bi), 0);
      font("normal", 8, GREY); doc.text(T(`Highest: ${pdfMoney(max, true)} (${d.series[peak].long})`), M, y + 2);
      y += 10;
      doc.setDrawColor(...LIGHT); doc.line(M, y + ch, M + TW, y + ch);
      d.series.forEach((s, i) => {
        const h = (s.spent / max) * ch, x = M + i * (bwid + gap);
        if (h > 0) { doc.setFillColor(...ACC); doc.rect(x, y + ch - h, bwid, h, "F"); }
        if (n <= 12 || i === 0 || (i + 1) % 5 === 0) doc.text(T(s.label), x + bwid / 2, y + ch + 11, { align: "center" });
      });
      y += ch + 28;
    }
    // Tables
    const pct = (a, b) => (b > 0 ? `${Math.round((a / b) * 100)}%` : "-");
    table("By category", ["Category", "Entries", "Amount", "Share"], d.cats.map((c) => [catById(c.id).name, String(c.count), pdfMoney(c.total), pct(c.total, d.spent)]), [0.46, 0.14, 0.24, 0.16], ["l", "r", "r", "r"]);
    table("By payment method", ["Method", "Entries", "Amount", "Share"], d.methods.map((x) => [METHODS[x.id] || "Other", String(x.count), pdfMoney(x.total), pct(x.total, d.spent)]), [0.46, 0.14, 0.24, 0.16], ["l", "r", "r", "r"]);
    table("Budgets", ["Budget", "Spent", "Limit", "Left"], d.budgets.map((b) => [b.name, pdfMoney(b.spent), pdfMoney(b.total), b.total - b.spent >= 0 ? pdfMoney(b.total - b.spent) : `over by ${pdfMoney(b.spent - b.total)}`]), [0.34, 0.22, 0.22, 0.22], ["l", "r", "r", "r"]);
    table("Biggest expenses", ["Date", "Description", "Category", "Amount"], d.top.map((e) => [fDate(e.date), entryTitle(e), catById(e.category).name, pdfMoney(e.amount)]), [0.14, 0.42, 0.24, 0.2], ["l", "l", "l", "r"]);
    table("All entries", ["Date", "Type", "Description", "Method", "Account", "Amount"], d.list.map((e) => [fDate(e.date), TYPES[e.type].label, entryTitle(e), METHODS[e.method] || "", e.type === "transfer" ? `${acctName(e.account)} to ${acctName(e.to)}` : acctName(e.account), `${isIn(e) ? "+" : e.type === "transfer" ? "" : "-"}${pdfMoney(e.amount)}`]), [0.1, 0.1, 0.29, 0.15, 0.18, 0.18], ["l", "l", "l", "l", "l", "r"]);
    // Page numbers
    const pages = doc.getNumberOfPages();
    for (let i = 1; i <= pages; i++) { doc.setPage(i); font("normal", 8, GREY); doc.text(T(`Spent  ·  ${d.label}`), M, H - 24); doc.text(`Page ${i} of ${pages}`, W - M, H - 24, { align: "right" }); }
    await saveFile(`spent-report-${d.slug}.pdf`, doc.output("blob"), "application/pdf");
  }

  async function exportXLSX(p, anchor) {
    const XLSX = await loadLib("xlsx");
    const d = reportData(p, anchor), cur = state.settings.currency;
    const wb = XLSX.utils.book_new();
    const sheet = (name, rows, widths, formats = {}) => {
      const ws = XLSX.utils.aoa_to_sheet(rows, { cellDates: true, dateNF: "yyyy-mm-dd" });
      ws["!cols"] = widths.map((w) => ({ wch: w }));
      for (const [colIdx, z] of Object.entries(formats)) for (let r = 1; r < rows.length; r++) { const ref = XLSX.utils.encode_cell({ r, c: Number(colIdx) }); if (ws[ref] && typeof ws[ref].v === "number") ws[ref].z = z; }
      XLSX.utils.book_append_sheet(wb, ws, name);
    };
    const num = "#,##0.00";
    sheet("Summary", [["Spent report", d.label], ["Created", todayISO()], ["Currency", cur], ["Entries", d.list.length], [], ["Spent", Math.max(0, d.spent)], ["Came in", d.income], [d.net >= 0 ? "Kept" : "Short by", Math.abs(d.net)], ["Savings rate", d.income > 0 ? d.net / d.income : ""]], [16, 30]);
    const wsSum = wb.Sheets.Summary;
    for (const r of [6, 7, 8]) if (wsSum[`B${r}`]) wsSum[`B${r}`].z = num;
    if (wsSum.B9 && typeof wsSum.B9.v === "number") wsSum.B9.z = "0%";
    sheet("Entries", [["Date", "Type", "Description", "Category", "Money out", "Money in", "Moved", "Account", "To account", "Method", "Person", "Pay back by", "Note"],
      ...d.list.map((e) => [parseISO(e.date), TYPES[e.type].label, entryTitle(e), e.category ? catById(e.category).name : "", outOf(e) ? e.amount : "", isIn(e) ? e.amount : "", e.type === "transfer" ? e.amount : "", acctName(e.account), e.to ? acctName(e.to) : "", METHODS[e.method] || "", e.person, e.due ? parseISO(e.due) : "", e.note])],
      [12, 11, 32, 20, 12, 12, 12, 18, 18, 14, 14, 12, 30], { 4: num, 5: num, 6: num });
    sheet("Categories", [["Category", "Entries", "Amount", "Share"], ...d.cats.map((c) => [catById(c.id).name, c.count, c.total, d.spent > 0 ? c.total / d.spent : 0])], [24, 10, 14, 10], { 2: num, 3: "0%" });
    sheet("Payment methods", [["Method", "Entries", "Amount", "Share"], ...d.methods.map((x) => [METHODS[x.id] || "Other", x.count, x.total, d.spent > 0 ? x.total / d.spent : 0])], [18, 10, 14, 10], { 2: num, 3: "0%" });
    sheet(p === "year" ? "By month" : "By day", [[p === "year" ? "Month" : "Day", "Spent", "Came in"], ...d.series.map((s) => [s.long, s.spent, s.income])], [22, 14, 14], { 1: num, 2: num });
    if (d.budgets.length) sheet("Budgets", [["Budget", "Spent", "Limit", "Carried over", "Left"], ...d.budgets.map((b) => [b.name, b.spent, b.total, b.carry, round2(b.total - b.spent)])], [22, 14, 14, 14, 14], { 1: num, 2: num, 3: num, 4: num });
    const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    const mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
    await saveFile(`spent-report-${d.slug}.xlsx`, new Blob([out], { type: mime }), mime);
  }
  async function runExport(kind, p = ui.insPeriod, anchor = ui.anchor) {
    if (kind === "csv") { const r = periodRange(p, anchor); await saveFile(`spent-entries-${reportData(p, anchor).slug}.csv`, toCSV(entriesBetween(r.from, r.to)), "text/csv"); return; }
    toast(kind === "pdf" ? "Preparing your PDF report…" : "Preparing your Excel workbook…");
    try { await (kind === "pdf" ? exportPDF(p, anchor) : exportXLSX(p, anchor)); }
    catch (e) { toast(e && /network|timeout|missing/.test(e.message) ? `The ${kind === "pdf" ? "PDF" : "Excel"} tool couldn't load. Check your connection and try again.` : "That report couldn't be made. Try again, or export a CSV instead."); }
  }

  /* ================= reminders and installing the app ================= */
  /* Reminders use the browser's notifications, so they only work on Spent's own site or the installed app, not inside
     another page. There's no server: a reminder shows when Spent is open, and on phones that support it the installed
     app also checks once or twice a day while closed. */
  const inFrame = (() => { try { return window.top !== window.self; } catch { return true; } })();
  const canNotify = () => typeof Notification !== "undefined" && window.isSecureContext && !window.claude && !inFrame;
  const canWorker = () => "serviceWorker" in navigator && window.isSecureContext && !window.claude && !inFrame;
  const DATA_CACHE = "spent-data";

  /* Bills and repayments due within a week, overdue ones included. */
  function reminderItems() {
    const t = todayISO(), until = addDays(t, 7), items = [];
    for (const { r, st } of upcoming()) {
      if (r.kind === "income" || st.due > until) continue;
      const when = st.overdue ? `was due ${fDate(st.due)}` : st.days === 0 ? "is due today" : st.days === 1 ? "is due tomorrow" : `is due ${fDate(st.due)}`;
      items.push({ key: `${r.id}:${st.key}`, due: st.due, title: `${r.name} ${when}`, body: `${r.variable ? "About " : ""}${money(r.amount)}${r.kind === "transfer" ? ` to ${acctName(r.to)}` : ""}. Open Spent to mark it ${RKIND[r.kind].done}.`, url: "./#recurring" });
    }
    for (const p of people()) {
      const st = debtStatus(p);
      if (!st || p.due > until) continue;
      const owed = p.balance > 0;
      items.push({ key: `debt:${p.key}:${p.due}`, due: p.due, title: owed ? `${p.name} owes you ${money(p.balance)}` : `You owe ${p.name} ${money(-p.balance)}`, body: `${st.overdue ? "It was due" : "It's due"} ${fDate(p.due)}.`, url: "./#wallet" });
    }
    return items.sort((a, b) => a.due.localeCompare(b.due));
  }
  async function readSent() { try { const c = await caches.open(DATA_CACHE), r = await c.match("sent.json"); return r ? await r.json() : {}; } catch { return {}; } }
  async function writeSent(sent) { try { const c = await caches.open(DATA_CACHE); await c.put("sent.json", new Response(JSON.stringify(sent))); } catch { /* reminders still work, they may repeat */ } }
  /* The service worker can't read the app's storage, so the list of what's due is copied where it can. */
  async function syncReminders() {
    if (!canWorker() || typeof caches === "undefined") return;
    try { const c = await caches.open(DATA_CACHE); await c.put("reminders.json", new Response(JSON.stringify({ enabled: !!state.settings.remind && !state.sample, items: reminderItems() }))); } catch { /* not supported here */ }
  }
  /* Shows each due item at most once a day: on the day before, on the day, and on days it's overdue. */
  async function checkReminders() {
    if (!state.settings.remind || state.sample || !canNotify() || Notification.permission !== "granted") return;
    const t = todayISO(), tomorrow = addDays(t, 1), sent = await readSent();
    const due = reminderItems().filter((x) => x.due <= tomorrow && sent[x.key] !== t);
    if (!due.length) return;
    const reg = canWorker() ? await navigator.serviceWorker.getRegistration() : null;
    for (const x of due.slice(0, 4)) {
      const o = { body: x.body, tag: x.key, icon: "icons/icon-192.png", badge: "icons/icon-192.png", data: { url: x.url } };
      try { if (reg) await reg.showNotification(x.title, o); else new Notification(x.title, o); sent[x.key] = t; } catch { /* the browser refused this one */ }
    }
    await writeSent(sent);
  }
  async function enableReminders(on) {
    if (!on) { state.settings.remind = false; commit(); syncReminders(); toast("Reminders turned off"); return; }
    if (!canNotify()) { toast("Reminders work on Spent's own website or the installed app."); return; }
    let perm = Notification.permission;
    if (perm === "default") { try { perm = await Notification.requestPermission(); } catch { perm = "denied"; } }
    if (perm !== "granted") { toast("Notifications are blocked for Spent. Allow them in your browser's site settings, then try again."); renderRemindSection(); return; }
    state.settings.remind = true;
    commit();
    try {
      const reg = await navigator.serviceWorker?.ready;
      if (reg && "periodicSync" in reg) {
        const st = await navigator.permissions.query({ name: "periodic-background-sync" }).catch(() => null);
        if (!st || st.state === "granted") await reg.periodicSync.register("spent-reminders", { minInterval: 12 * 3600 * 1000 }).catch(() => {});
      }
    } catch { /* checking while closed isn't available here */ }
    await syncReminders();
    toast(state.sample ? "Reminders are on. They start once you track your own money." : "Reminders are on");
    checkReminders();
    renderRemindSection();
  }

  /* ---------- installing ---------- */
  let installPrompt = null;
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installPrompt = e; renderRemindSection(); });
  window.addEventListener("appinstalled", () => { installPrompt = null; toast("Spent is installed"); renderRemindSection(); });
  const standalone = () => { try { return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; } catch { return false; } };
  const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  async function installApp() {
    if (!installPrompt) return;
    installPrompt.prompt();
    try { await installPrompt.userChoice; } catch { /* dismissed */ }
    installPrompt = null;
    renderRemindSection();
  }

  /* The Settings section for both */
  function remindHTML() {
    const notify = canNotify(), perm = notify ? Notification.permission : "unavailable", on = !!state.settings.remind && perm === "granted";
    let install = "";
    if (canWorker() && !standalone()) {
      if (installPrompt) install = `<div class="set-line"><span>Install Spent<small>Opens like an app and works without internet.</small></span><button type="button" class="btn small" data-act="install">${svg("download")}Install</button></div>`;
      else if (isIOS()) install = `<p class="hint">To install on iPhone or iPad, open this page in Safari, tap Share, then Add to Home Screen.</p>`;
      else install = `<p class="hint">Spent works offline once it has loaded. To install it, use your browser's Install or Add to Home Screen option.</p>`;
    } else if (standalone()) install = `<p class="hint">Spent is installed on this device and works without internet.</p>`;
    const remind = notify
      ? `<label class="check"><input type="checkbox" id="set-remind"${on ? " checked" : ""}><span>Remind me about bills and money that's due<small>${perm === "denied" ? "Notifications are blocked for this site. Allow them in your browser's site settings first." : "A notification the day before, on the day and while overdue. Reminders show when Spent is open; on some phones the installed app also checks while it's closed."}</small></span></label>`
      : `<p class="hint">Notifications work on Spent's own website or the installed app, not inside this page. Bills that are due always show at the top of Home.</p>`;
    return `<h3>Reminders${canWorker() ? " and offline" : ""}</h3>${remind}${install}`;
  }
  function renderRemindSection() { const el = $("#set-remind-group"); if (el) el.innerHTML = remindHTML(); }

  if (canWorker()) {
    navigator.serviceWorker.register("sw.js").catch(() => { /* offline mode isn't available here */ });
    navigator.serviceWorker.addEventListener?.("message", (e) => { if (e.data?.type === "open" && e.data.url) location.hash = e.data.url.split("#")[1] || "home"; });
  }
  setInterval(() => { if (!document.hidden) checkReminders(); }, 30 * 60 * 1000);

  /* ================= routing and events ================= */
  function route() {
    let h = location.hash.slice(1);
    if (h === "expenses") h = "activity"; // links from the first version
    const v = VIEWS.includes(h) ? h : "home";
    const changed = v !== ui.view;
    ui.view = v;
    for (const id of VIEWS) $("#view-" + id).hidden = id !== v;
    $$("[data-view]").forEach((a) => { if (a.dataset.view === v) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    closeMenu(); hideTip();
    render();
    onScroll();
    if (changed) window.scrollTo(0, 0);
  }
  const topbar = $("#topbar");
  function onScroll() { topbar.classList.toggle("scrolled", window.scrollY > 8 || ui.view !== "home"); }
  window.addEventListener("scroll", () => { onScroll(); hideTip(); if (menuEl) closeMenu(); }, { passive: true });
  window.addEventListener("hashchange", route);
  window.addEventListener("resize", () => { $$(".row-track").forEach((tr) => tr._upd?.()); hideTip(); closeMenu(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && $("#sheet").hidden) { render(); runAuto(); checkReminders(); } });
  const setTopH = () => rootEl.style.setProperty("--top-h", topbar.offsetHeight + "px");
  try { new ResizeObserver(setTopH).observe(topbar); } catch { window.addEventListener("resize", setTopH); }
  setTopH();

  function setMonth(m) { ui.month = m; render(); }
  function showActivity({ account = "", person = "", cat = "all", month = "", method = "", period = "month" } = {}) {
    Object.assign(ui, { actAccount: account, actPerson: person, actCat: cat, actMethod: method, actType: "all", actQuery: "", actView: "list", actPeriod: account || person ? "all" : period });
    if (month) ui.month = month;
    if (location.hash === "#activity") route(); else location.hash = "activity";
  }
  /* What a new entry should start as, given what the person is looking at. */
  function addPreset() {
    const p = {}, cur = monthOf(todayISO());
    if (ui.view === "activity") {
      if (ui.actPeriod !== "all" && !inPeriod(ui.actPeriod, ui.anchor)) p.date = periodRange(ui.actPeriod, ui.anchor).from;
      if (ui.actMethod) p.method = ui.actMethod;
      if (ui.actType === "people") p.type = "lent"; else if (ui.actType !== "all") p.type = ui.actType;
      if (ui.actCat !== "all") p.category = ui.actCat;
      if (ui.actAccount) p.account = ui.actAccount;
      if (ui.actPerson) { p.type = "lent"; p.person = people().find((x) => x.key === ui.actPerson)?.name || ""; }
    } else if (ui.view === "insights" && !inPeriod(ui.insPeriod, ui.anchor)) p.date = periodRange(ui.insPeriod, ui.anchor).from;
    return p;
  }

  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-sheet-close]")) { closeSheet(); return; }
    if (e.target.closest("[data-sheet-del]")) { sheetDelete?.(); return; }
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const id = el.dataset.id, k = el.dataset.k;
    const rec = () => state.recurring.find((r) => r.id === id);
    const acct = () => state.accounts.find((a) => a.id === id);
    switch (el.dataset.act) {
      case "sheet": sheetAct?.(k, el); break;
      case "add-entry": entryForm(null, addPreset()); break;
      case "edit-entry": { const x = state.entries.find((v) => v.id === id); if (x) entryForm(x); break; }
      case "add-rec": recurringForm(); break;
      case "edit-rec": { const r = rec(); if (r) recurringForm(r); break; }
      case "pay": { const r = rec(); if (r) payForm(r); break; }
      case "toggle-rec": toggleRecurring(id); break;
      case "rec-menu": {
        const r = rec(); if (!r) break;
        openMenu(el, [
          { label: "History", icon: "clock", run: () => historySheet(r) },
          { label: "Edit", icon: "edit", run: () => recurringForm(r) },
          { label: r.active === false ? "Resume" : "Pause", icon: r.active === false ? "play" : "pause", run: () => toggleRecurring(r.id) },
          { label: "Delete", icon: "trash", danger: true, run: () => deleteRecurring(r.id) },
        ]);
        break;
      }
      case "settings": settingsSheet(); break;
      case "budgets": budgetSheet(); break;
      case "add-acct": accountForm(null, false); break;
      case "add-goal": accountForm(null, true); break;
      case "edit-acct": { const a = acct(); if (a) accountForm(a); break; }
      case "fund": entryForm(null, { type: "transfer", to: id }); break;
      case "acct-activity": closeSheet(); showActivity({ account: id }); break;
      case "restore-acct": { const a = acct(); if (a) { a.archived = false; commit(); toast(`${a.name} restored`); } break; }
      case "person": showActivity({ person: k }); break;
      case "settle": {
        const p = people().find((x) => x.key === k);
        if (p && p.balance) entryForm(null, { type: p.balance > 0 ? "collected" : "repaid", person: p.name, amount: Math.abs(p.balance) });
        break;
      }
      case "lend": entryForm(null, { type: "lent" }); break;
      case "import": importSheet(); break;
      case "install": installApp(); break;
      case "export-menu": {
        const what = periodLabel(ui.insPeriod, ui.anchor);
        openMenu(el, [
          { label: `PDF report for ${what}`, icon: "download", run: () => runExport("pdf") },
          { label: `Excel workbook for ${what}`, icon: "download", run: () => runExport("xlsx") },
          { label: `CSV of entries for ${what}`, icon: "download", run: () => runExport("csv") },
        ]);
        break;
      }
      case "go-insights": if (location.hash === "#insights") route(); else location.hash = "insights"; break;
      case "go-health": ui.insPeriod = "month"; ui.anchor = todayISO(); if (location.hash === "#insights") route(); else location.hash = "insights"; setTimeout(() => $(".health")?.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" }), 60); break;
      case "go-subs": ui.recFilter = "subs"; ui.recQuery = ""; if (location.hash === "#recurring") route(); else location.hash = "recurring"; break;
      case "go-calendar": ui.actPeriod = "month"; ui.actView = "calendar"; ui.anchor = todayISO(); if (location.hash === "#activity") route(); else location.hash = "activity"; break;
      case "start-fresh": startFresh("Sample data cleared. Add your first entry when you're ready"); break;
      case "hide-banner": ui.bannerHidden = true; renderBanner(); break;
      case "month-prev": setMonth(addMonths(ui.month, -1)); break;
      case "month-next": setMonth(addMonths(ui.month, 1)); break;
      case "month-now": setMonth(monthOf(todayISO())); break;
      case "act-type": ui.actType = k; if (k !== "all" && k !== "expense") ui.actCat = "all"; renderActivity(); break;
      case "act-cat": ui.actCat = ui.actCat === el.dataset.cat ? "all" : el.dataset.cat; if (ui.actCat !== "all" && ui.actType !== "expense") ui.actType = "all"; renderActivity(); break;
      case "act-period": ui.actPeriod = PERIODS[k] ? k : "month"; renderActivity(); break;
      case "act-view": ui.actView = k === "calendar" ? "calendar" : "list"; if (ui.actView === "calendar") ui.actPeriod = "month"; renderActivity(); break;
      case "cal-day": ui.anchor = el.dataset.d; ui.actPeriod = "day"; ui.actView = "list"; renderActivity(); break;
      case "ins-period": ui.insPeriod = ["week", "month", "year"].includes(k) ? k : "month"; renderInsights(); break;
      case "period-prev": case "period-next": ui.anchor = stepAnchor(el.dataset.p, ui.anchor, el.dataset.act === "period-next" ? 1 : -1); render(); break;
      case "period-now": ui.anchor = todayISO(); render(); break;
      case "go-method": showActivity({ method: k, period: ui.view === "insights" ? ui.insPeriod : "month" }); break;
      case "act-clear-acct": ui.actAccount = ""; renderActivity(); break;
      case "act-clear-person": ui.actPerson = ""; renderActivity(); break;
      case "clear-filters": Object.assign(ui, { actType: "all", actCat: "all", actQuery: "", actAccount: "", actPerson: "", actMethod: "" }); renderActivity(); break;
      case "rec-filter": ui.recFilter = el.dataset.f; renderRecurring(); break;
      case "clear-rec-filters": ui.recFilter = "all"; ui.recQuery = ""; renderRecurring(); break;
      case "go-cat": showActivity({ cat: el.dataset.cat, month: ui.view === "home" ? monthOf(todayISO()) : "", period: ui.view === "insights" ? ui.insPeriod : "month" }); break;
      case "row-prev": case "row-next": {
        const tr = el.parentElement.querySelector(".row-track");
        tr.scrollBy({ left: (el.dataset.act === "row-next" ? 1 : -1) * tr.clientWidth * 0.82, behavior: reduced ? "auto" : "smooth" });
        break;
      }
      case "add-cat": addCategory(); break;
      case "del-cat": removeCategory(el.dataset.cat); break;
      case "export-csv": saveFile(`spent-entries-${stamp()}.csv`, toCSV(), "text/csv"); break;
      case "backup": saveFile(`spent-backup-${stamp()}.json`, JSON.stringify({ app: "Spent", exported: new Date().toISOString(), ...state }, null, 2), "application/json"); break;
      case "erase": confirmBox(state.sample ? "Clear the sample data and start with an empty tracker?" : "Erase every entry, account and recurring item? You can undo this for a few seconds afterwards.", state.sample ? "Clear sample data" : "Erase everything", () => { startFresh(state.sample ? "Sample data cleared" : "Everything erased"); closeSheet(); }); break;
      default: break;
    }
  });
  $("#scrim").addEventListener("click", closeSheet);
  $("#sheet-card").addEventListener("submit", (e) => {
    e.preventDefault();
    if (sheetSubmit) { if (sheetSubmit() === false) return; }
    closeSheet();
  });
  document.addEventListener("submit", (e) => {
    if (e.target.id !== "quick-form") return;
    e.preventDefault();
    const input = $("#quick-input"), text = input.value.trim();
    if (!text) { input.focus(); return; }
    if (quickAdd(text)) input.value = "";
  });
  document.addEventListener("input", (e) => {
    if (e.target.id === "quick-input") {
      const q = parseQuick(e.target.value), out = $("#quick-preview");
      if (out) out.textContent = !e.target.value.trim() ? "Write it the way you'd say it. You can add the date, how you paid, or who you lent money to." : q.amount ? `${quickSummary(q)}${TYPES[q.type].person && !q.person ? ". Add who it's with." : ""}` : "Add an amount, like ₹250.";
    }
    if (e.target.id === "act-search") { ui.actQuery = e.target.value; renderActList(); }
    else if (e.target.id === "rec-search") { ui.recQuery = e.target.value; renderRecList(); }
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "act-sort") { ui.actSort = e.target.value; renderActList(); }
    else if (e.target.id === "act-method") { ui.actMethod = e.target.value; renderActivity(); }
    else if (e.target.id === "rec-sort") { ui.recSort = e.target.value; renderRecList(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { if (menuEl) { closeMenu(); return; } if (!$("#sheet").hidden) { closeSheet(); return; } }
    if (!$("#sheet").hidden) {
      if (e.key === "Tab") {
        const f = $$("#sheet-card button, #sheet-card input, #sheet-card select, #sheet-card textarea").filter((x) => !x.disabled && x.getClientRects().length && !(x.type === "radio" && !x.checked));
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.("input, textarea, select, [contenteditable]")) return;
    if (e.key === "n" || e.key === "N") { e.preventDefault(); entryForm(null, addPreset()); }
    else if (e.key === "/") { const s = $(".view:not([hidden]) input[type=search]"); if (s) { e.preventDefault(); s.focus(); } }
  });
  document.addEventListener("pointerover", (e) => { const t = e.target.closest?.("[data-tip]"); if (t) showTip(t); });
  document.addEventListener("pointerout", (e) => { const t = e.target.closest?.("[data-tip]"); if (t && !t.contains(e.relatedTarget)) hideTip(); });
  document.addEventListener("focusin", (e) => { const t = e.target.closest?.("[data-tip]"); if (t) showTip(t); else hideTip(); });

  /* ================= start ================= */
  $$("[data-icon]").forEach((el) => { const s = svg(el.dataset.icon); if (el.tagName === "I") el.outerHTML = s; else el.innerHTML = s; });
  applyTheme();
  route();
  setSync("local");
  runAuto();
  initCloud();
  syncReminders().then(checkReminders);
})();
</script>
</body>
</html>
